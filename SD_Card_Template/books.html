    <script>
        /* theme via shared ThemeManager instead of a local reimplementation */
        (function () { try { ThemeManager.applyDarkMode(ThemeManager.getDarkMode()); } catch (e) { } })();
        window.addEventListener('storage', (ev) => { if (ev.key === ThemeManager.STORAGE_KEY) ThemeManager.applyDarkMode(ev.newValue === 'true'); });

        /* Constants */
        const ROOT = '/Books';
        const INDEX_ENDPOINT = '/api/index';
        const BOOK_EXTS = ['.pdf', '.epub', '.mobi', '.azw3', '.cbz', '.cbr', '.cbt', '.cb7', '.djvu', '.txt'];
        const AUDIO_EXTS = ['.mp3', '.m4b', '.m4a', '.ogg', '.wav', '.aac', '.flac'];
        const IMAGE_EXTS = ['.jpg', '.jpeg', '.png', '.webp', '.avif', '.gif', '.bmp'];
        const COMIC_EXTS = ['.cbz', '.cbr'];

        /* Utils */
        function ext(name) { const i = name.lastIndexOf('.'); return i >= 0 ? name.slice(i).toLowerCase() : ''; }
        function isBookName(n) { return BOOK_EXTS.includes(ext(n)); }
        function isAudioName(n) { return AUDIO_EXTS.includes(ext(n)); }
        function isImageName(n) { return IMAGE_EXTS.includes(ext(n)); }
        function isComicName(n) { return COMIC_EXTS.includes(ext(n)); }
        function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', '\'': '&#39;' }[c])); }
        function prettify(filename) {
            if (!filename) return '';
            let base = filename.replace(/\.[^/.]+$/, '');
            let title = base.replace(/[_\.]+/g, ' ').trim();
            title = title.replace(/\s*($$\d{4}$$|\d{4})\s*$/, '').trim();
            return title || filename;
        }
        function fileUrlDirect(path) { if (!path) return ''; return `/media?file=${encodeURIComponent(normalizePath(path))}`; }
        function formatBytes(bytes) {
            if (!bytes && bytes !== 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(Math.max(bytes, 1)) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        function formatTime(seconds) {
            if (!seconds || !isFinite(seconds)) return '0:00';
            seconds = Math.floor(seconds);
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            if (hrs) return hrs + ':' + mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
            return mins + ':' + secs.toString().padStart(2, '0');
        }

        /* Resume store */
        const RESUME_KEY = 'nomad_resume_store_v1';
        function readResume() { try { return JSON.parse(localStorage.getItem(RESUME_KEY) || '{}'); } catch (e) { return {}; } }
        function writeResume(obj) { try { localStorage.setItem(RESUME_KEY, JSON.stringify(obj)); } catch (e) { } }
        function fileKey(path, sz, mt) { return `${normalizePath(path)}|${sz || 0}|${mt || 0}`; }
        function findResume(movie) {
            const store = readResume();
            const norm = normalizePath(movie.path);
            const exact = fileKey(movie.path, movie.sz || 0, movie.mt || 0);
            if (store[exact]) return { key: exact, entry: store[exact] };
            for (const k of Object.keys(store)) { const p = (k.split('|')[0] || ''); if (normalizePath(p) === norm) return { key: k, entry: store[k] }; }
            for (const k of Object.keys(store)) { const p = (k.split('|')[0] || '').replace(/^\//, ''); if (p === norm.replace(/^\//, '')) return { key: k, entry: store[k] }; }
            const base = norm.split('/').pop().toLowerCase();
            for (const k of Object.keys(store)) { const p = (k.split('|')[0] || '').toLowerCase(); if (p.split('/').pop() === base) return { key: k, entry: store[k] }; }
            return null;
        }
        function clearResumeFor(path) {
            const store = readResume();
            const norm = normalizePath(path);
            let changed = false;
            for (const k of Object.keys(store)) {
                const p = (k.split('|')[0] || '');
                if (normalizePath(p) === norm || p.replace(/^\//, '') === norm.replace(/^\//, '')) {
                    delete store[k]; changed = true;
                }
            }
            if (changed) writeResume(store);
        }
        // kind is 'percent' or 'time'. Without it the value was guessed from its
        // size, so an audiobook paused at 45 seconds read as "Resume 45%".
        function updateResumeBadge(movie, positionOrPercent, kind) {
            if (!movie || !movie.path) return;
            const cards = Array.from(gridEl.querySelectorAll('.media-card'));
            for (const card of cards) {
                if (card.dataset.path === movie.path) {
                    const badge = card.querySelector('.badge-resume');
                    const wrapper = card.querySelector('.thumb-wrapper');
                    const show = positionOrPercent && positionOrPercent > 1;
                    if (show) {
                        const asPercent = kind
                            ? kind === 'percent'
                            : (typeof positionOrPercent === 'number' && positionOrPercent <= 100);
                        const text = asPercent
                            ? `Resume ${Math.round(positionOrPercent)}%`
                            : `Resume ${formatTime(positionOrPercent)}`;
                        if (badge) { badge.textContent = text; }
                        else if (wrapper) {
                            const div = document.createElement('div');
                            div.className = 'badge-resume';
                            div.textContent = text;
                            wrapper.appendChild(div);
                        }
                    } else {
                        if (badge) badge.remove();
                    }
                    break;
                }
            }
        }

        /* DOM refs */
        const gridEl = document.getElementById('grid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const viewButtons = document.querySelectorAll('.view-btn');
        const listModal = document.getElementById('listModal');
        const listModalTitle = document.getElementById('listModalTitle');
        const listContainer = document.getElementById('listContainer');
        const listCloseBtn = document.getElementById('listCloseBtn');
        const actionModal = document.getElementById('actionModal');
        const actionTitle = document.getElementById('actionTitle');
        const viewButton = document.getElementById('viewButton');
        const downloadButton = document.getElementById('downloadButton');
        const actionCancelBtn = document.getElementById('actionCancelBtn');

        /* Audio refs */
        const audioPlayer = document.getElementById('audioPlayer');
        const audioTitle = document.getElementById('audioTitle');
        const audioElement = document.getElementById('audioElement');
        const playPauseBtn = document.getElementById('playPause');
        const speedBtn = document.getElementById('speedBtn');
        const audioProgressBar = document.getElementById('audioProgressBar');
        const audioProgressFill = document.getElementById('audioProgressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        /* EPUB refs */
        const readerContainer = document.getElementById('readerContainer');
        const readerTitle = document.getElementById('readerTitle');
        const epubViewer = document.getElementById('epub-viewer');
        const progressInfo = document.getElementById('progressInfo');
        const tocBtn = document.getElementById('tocBtn');
        const closeReaderBtn = document.getElementById('closeReader');
        const fontUpBtn = document.getElementById('fontSizeUp');
        const fontDownBtn = document.getElementById('fontSizeDown');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const tocPanel = document.getElementById('tocPanel');
        const tocContent = document.getElementById('tocContent');
        const closeToc = document.getElementById('closeToc');
        const viewModeBtn = document.getElementById('viewModeBtn');

        /* State */
        let library = [];
        let filtered = [];
        let currentSize = localStorage.getItem('nomadBooksSize') || 'medium';
        let currentItem = null;
        let currentBook = null;
        let rendition = null;
        let epubFontSize = parseInt(localStorage.getItem('nomad_epub_font_pct') || '110', 10);
        let epubFlow = localStorage.getItem('nomad_epub_flow') || 'paginated';
        const ANIM_KEY = 'nomadBooksAnimated_v1';

        /* Audio bottom padding management */
        function updateAudioHeight() {
            const player = document.getElementById('audioPlayer');
            const height = (player && player.classList.contains('active')) ? player.offsetHeight : 0;
            document.documentElement.style.setProperty('--audio-height', height + 'px');
        }
        window.addEventListener('resize', updateAudioHeight);

        /* Index fetch (NDJSON) */
        async function fetchIndex(path) {
            const url = `${INDEX_ENDPOINT}?path=${encodeURIComponent(normalizePath(path))}`;
            let res = await fetch(url);
            // 503 means the SD is busy for a moment, not that the index is missing
            for (let i = 0; i < 3 && res.status === 503; i++) {
                await new Promise(r => setTimeout(r, 800 * (i + 1)));
                res = await fetch(url);
            }
            if (!res.ok) throw new Error('index fetch failed ' + res.status);
            const text = await res.text();
            const lines = text.split('\n').filter(Boolean);
            const header = lines.length ? (() => { try { return JSON.parse(lines[0]); } catch (e) { console.warn('index header parse failed', lines[0]); return null; } })() : null;
            const entries = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                try { entries.push(JSON.parse(line)); }
                catch (err) {
                    const brace = line.indexOf('{');
                    if (brace >= 0) { try { entries.push(JSON.parse(line.slice(brace))); continue; } catch (e2) { } }
                    console.warn('index line parse failed', line);
                }
            }
            return { header, entries };
        }

        /* Build top-level library */
        async function buildLibrary() {
            const out = [];
            const rootResp = await fetchIndex(ROOT);

            const rootImages = new Map();
            for (const e of rootResp.entries) {
                if (e.n && e.n.includes('/')) continue;
                if (e.t === 'f' && isImageName(e.n)) {
                    rootImages.set(e.n.replace(/\.[^/.]+$/, '').toLowerCase(), normalizePath((ROOT === '/' ? '' : ROOT) + '/' + e.n));
                }
            }

            for (const e of rootResp.entries) {
                if (e.n && e.n.includes('/')) continue;
                
                if (e.t === 'd') {
                    const seriesName = e.n;
                    const dir = normalizePath((ROOT === '/' ? '' : ROOT) + '/' + seriesName);
                    let cover = null;
                    const variants = [
                        seriesName.toLowerCase(),
                        seriesName.toLowerCase().replace(/\s+/g, '-'),
                        seriesName.toLowerCase().replace(/\s+/g, '_')
                    ];
                    for (const v of variants) { if (rootImages.has(v)) { cover = rootImages.get(v); break; } }
                    if (!cover) ['poster', 'cover', 'folder', 'art'].forEach(k => { if (!cover && rootImages.has(k)) cover = rootImages.get(k); });
                    
                    const isComic = e.comic === true;
                    out.push({ name: seriesName.replace(/[_\.]+/g, ' ').trim(), dir, cover, type: 'dir', isComic });

                } else if (e.t === 'f') {
                    if (isBookName(e.n) || isAudioName(e.n) || isComicName(e.n)) {
                        const p = normalizePath((ROOT === '/' ? '' : ROOT) + '/' + e.n);
                        const base = e.n.replace(/\.[^/.]+$/, '').toLowerCase();
                        const cover = rootImages.has(base) ? rootImages.get(base) : null;
                        out.push({ name: prettify(e.n), dir: null, cover, type: 'file', fileEntry: { name: e.n, path: p, sz: e.sz || 0, mt: e.mt || 0 } });
                    }
                }
            }

            out.sort((a, b) => a.name.localeCompare(b.name));
            return out;
        }
        async function loadDirContents(dir) {
            try {
                const resp = await fetchIndex(dir);
                const files = [];
                const images = new Map();
                
                const normalizedDir = normalizePath(dir);
                
                for (const e of resp.entries) {
                    if (!e.p || !e.n) continue;
                    
                    const entryPath = normalizePath(e.p);
                    
                    if (entryPath === normalizedDir) continue;
                    
                    if (!entryPath.startsWith(normalizedDir + '/')) continue;
                    
                    const relativePath = entryPath.substring(normalizedDir.length + 1);
                    if (relativePath.includes('/')) continue;
                    
                    if (e.t === 'f' && isImageName(e.n)) {
                        const base = e.n.replace(/\.[^/.]+$/, '').toLowerCase();
                        images.set(base, entryPath);
                    }
                }
                
                for (const e of resp.entries) {
                    if (!e.p || !e.n) continue;
                    
                    const entryPath = normalizePath(e.p);
                    
                    if (entryPath === normalizedDir) continue;
                    
                    if (!entryPath.startsWith(normalizedDir + '/')) continue;
                    
                    const relativePath = entryPath.substring(normalizedDir.length + 1);
                    if (relativePath.includes('/')) continue;
                    
                    if (e.t === 'f' && (isBookName(e.n) || isAudioName(e.n) || isComicName(e.n))) {
                        const base = e.n.replace(/\.[^/.]+$/, '').toLowerCase();
                        const cover = images.has(base) ? images.get(base) : null;
                        files.push({ name: prettify(e.n), path: entryPath, sz: e.sz || 0, mt: e.mt || 0, cover });
                    } else if (e.t === 'd') {
                        const isComic = e.comic === true;
                        const base = e.n.toLowerCase();
                        const cover = images.has(base) ? images.get(base) : null;
                        files.push({ name: e.n, path: entryPath, isDir: true, isComic, cover });
                    }
                }
                files.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                return { header: resp.header, files };
            } catch (err) {
                console.warn('loadDirContents failed', dir, err);
                return { header: null, files: [] };
            }
        }
        /* View controls */
        function setViewSize(size) {
            currentSize = size;
            viewButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.size === size));
            gridEl.className = `media-grid ${size}`;
            localStorage.setItem('nomadBooksSize', size);
        }
        setViewSize(currentSize);
        viewButtons.forEach(btn => btn.addEventListener('click', () => setViewSize(btn.dataset.size)));

        /* Render grid */
        function renderGrid() {
            if (filtered.length === 0) {
                gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);padding:12px">No books found.</p>';
                return;
            }

            const withImages = filtered.filter(item => item.cover);
            const noImages = filtered.filter(item => !item.cover);

            const useMixedMode = withImages.length > 0 && noImages.length > 0;

            if (useMixedMode) {
                gridEl.className = `media-grid ${currentSize}`;
            } else {
                gridEl.className = `media-grid ${currentSize}`;
            }

            const shouldAnimate = !localStorage.getItem(ANIM_KEY);
            let animIdx = 0;

            const frag = document.createDocumentFragment();

            if (withImages.length > 0 || !useMixedMode) {
                const itemsToRender = useMixedMode ? withImages : filtered;
                itemsToRender.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    if (item.type === 'dir') {
                        card.classList.add('is-directory');
                    }
                    card.setAttribute('role', 'listitem');
                    card.setAttribute('aria-label', item.name || '');
                    const pathVal = item.type === 'file' ? (item.fileEntry?.path || '') : (item.dir || '');
                    card.dataset.path = pathVal;

                    const coverPath = item.cover ? fileUrlDirect(item.cover) : '';
                    const imgHTML = coverPath ? `<img class="media-thumb" loading="lazy" src="${coverPath}" alt="${escapeHtml(item.name)}">` : '';

                    const showFolderIcon = item.type === 'dir' && !item.isComic;
                    const folderIconHTML = showFolderIcon ? '<span class="folder-icon">📁</span>' : '';

                    card.innerHTML = `
                    <div class="thumb-wrapper" aria-hidden="false">
                        <span class="fallback-text">${escapeHtml(item.name)}</span>
                        ${imgHTML}
                        ${folderIconHTML}
                    </div>
                    `;

                    const img = card.querySelector('img');
                    const fallback = card.querySelector('.fallback-text');
                    if (img && coverPath) {
                        img.addEventListener('load', () => { img.style.opacity = '1'; if (fallback) fallback.style.display = 'none'; });
                        img.addEventListener('error', () => { img.style.display = 'none'; if (fallback) fallback.style.display = 'block'; });
                        img.src = coverPath;
                    } else {
                        if (fallback) fallback.style.display = 'block';
                    }

                    card.addEventListener('click', async () => {
                        if (item.type === 'dir') {
                            if (item.isComic) {
                                window.location.href = `/comics?path=${encodeURIComponent(item.dir)}`;
                            } else {
                                await openListModal(item);
                            }
                        } else {
                            openActionModal(item.fileEntry);
                        }
                    });

                    if (shouldAnimate) {
                        card.style.animation = 'pop-in .36s cubic-bezier(.22,.9,.32,1) both';
                        card.style.animationDelay = Math.min(6000, animIdx * 55) + 'ms';
                        animIdx++;
                    }

                    const fe = item.type === 'file' ? item.fileEntry : null;
                    if (fe) {
                        const resume = findResume({ path: fe.path, sz: fe.sz, mt: fe.mt });
                        if (resume && resume.entry) {
                            const e = resume.entry;
                            if (e.cfi || e.page || (e.time && e.duration)) {
                                updateResumeBadge({ path: fe.path }, e.percent ? e.percent : e.time, e.percent ? 'percent' : 'time');
                            }
                        }
                    }

                    frag.appendChild(card);
                });
            }

            if (useMixedMode && noImages.length > 0) {
                const noCoverSection = document.createElement('div');
                noCoverSection.className = 'no-cover-list';
                noCoverSection.style.gridColumn = '1 / -1';

                noImages.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = 'book-row';
                    const pathVal = item.type === 'file' ? (item.fileEntry?.path || '') : (item.dir || '');
                    row.dataset.path = pathVal;

                    let icon = '📖';
                    if (item.type === 'dir') {
                        icon = item.isComic ? '📚' : '📁';
                    } else if (item.fileEntry) {
                        const name = item.fileEntry.name.toLowerCase();
                        if (name.endsWith('.mp3') || name.endsWith('.m4a') || name.endsWith('.m4b')) {
                            icon = '🎧';
                        } else if (name.endsWith('.cbz') || name.endsWith('.cbr')) {
                            icon = '📚';
                        }
                    }

                    const contextText = item.type === 'file' && item.fileEntry ? formatBytes(item.fileEntry.sz || 0) : '';

                    row.innerHTML = `
                        <span class="book-icon">${icon}</span>
                        <span class="title">${escapeHtml(item.name)}</span>
                        ${contextText ? `<span class="context">${contextText}</span>` : ''}
                    `;

                    row.addEventListener('click', async () => {
                        if (item.type === 'dir') {
                            if (item.isComic) {
                                window.location.href = `/comics?path=${encodeURIComponent(item.dir)}`;
                            } else {
                                await openListModal(item);
                            }
                        } else {
                            openActionModal(item.fileEntry);
                        }
                    });

                    if (shouldAnimate) {
                        row.style.animation = 'pop-in .36s cubic-bezier(.22,.9,.32,1) both';
                        row.style.animationDelay = Math.min(6000, animIdx * 55) + 'ms';
                        animIdx++;
                    }

                    noCoverSection.appendChild(row);
                });

                frag.appendChild(noCoverSection);
            }

            gridEl.innerHTML = '';
            gridEl.appendChild(frag);
            if (shouldAnimate) { try { localStorage.setItem(ANIM_KEY, '1'); } catch (e) { } }
        }



        /* List modal */
        async function openListModal(item) {
            listModalTitle.textContent = item.name;
            listContainer.innerHTML = '<p style="padding:12px;color:var(--muted)">Loading…</p>';
            listModal.style.display = 'flex';

            const resp = await loadDirContents(item.dir);
            const files = resp.files || [];
            if (files.length === 0) {
                listContainer.innerHTML = '<p style="padding:12px;color:var(--muted)">No files found in this directory.</p>';
                return;
            }

            listContainer.innerHTML = '';
            listContainer.style.maxHeight = '70vh';
            listContainer.style.overflowY = 'auto';
            listContainer.style.display = 'grid';
            listContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(120px, 1fr))';
            listContainer.style.gap = '12px';
            listContainer.style.padding = '12px';

            const frag = document.createDocumentFragment();

            for (const f of files) {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.style.maxWidth = '100%';
                card.style.margin = '0';
                
                if (f.isDir) {
                    card.classList.add('is-directory');
                }

                const coverPath = f.cover ? fileUrlDirect(f.cover) : '';
                const imgHTML = coverPath ? `<img class="media-thumb" loading="lazy" src="${coverPath}" alt="${escapeHtml(f.name)}">` : '';

                card.innerHTML = `
                <div class="thumb-wrapper" aria-hidden="false">
                    <span class="fallback-text">${escapeHtml(f.name)}</span>
                    ${imgHTML}
                </div>
                `;

                const img = card.querySelector('img');
                const fallback = card.querySelector('.fallback-text');
                if (img && coverPath) {
                    img.addEventListener('load', () => { 
                        img.style.opacity = '1'; 
                        if (fallback) fallback.style.display = 'none'; 
                    });
                    img.addEventListener('error', () => { 
                        img.style.display = 'none'; 
                        if (fallback) fallback.style.display = 'block'; 
                    });
                    img.src = coverPath;
                } else {
                    if (fallback) fallback.style.display = 'block';
                }

                card.addEventListener('click', () => {
                    listModal.style.display = 'none';
                    if (f.isDir) {
                        if (f.isComic) {
                            window.location.href = `/comics?path=${encodeURIComponent(f.path)}`;
                        } else {
                            openListModal({ name: f.name, dir: f.path });
                        }
                    } else {
                        openActionModal({ name: f.name, path: f.path, sz: f.sz, mt: f.mt });
                    }
                });

                frag.appendChild(card);
            }

            listContainer.appendChild(frag);
        }
        function closeListModal() { listModal.style.display = 'none'; }
        listCloseBtn.addEventListener('click', closeListModal);

        /* Action modal */
        function downloadFile(path, filename) {
            const a = document.createElement('a');
            a.href = path.startsWith('/') ? path : ('/' + path);
            a.download = filename || (path ? path.split('/').pop() : 'file');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        /* Natural sort comparator for filenames */
        function naturalSortName(a, b) {
            const ax = String(a).split(/(\d+)/).map(s => (/\d+/.test(s) ? Number(s) : s.toLowerCase()));
            const bx = String(b).split(/(\d+)/).map(s => (/\d+/.test(s) ? Number(s) : s.toLowerCase()));
            for (let i = 0; i < Math.max(ax.length, bx.length); i++) {
                if (ax[i] === undefined) return -1;
                if (bx[i] === undefined) return 1;
                if (ax[i] === bx[i]) continue;
                return ax[i] < bx[i] ? -1 : 1;
            }
            return 0;
        }

        function openActionModal(file) {
            currentItem = file;
            actionTitle.textContent = file.name || 'File';
            const fext = ext(file.path).toLowerCase();

            if (fext === '.pdf') {
                viewButton.textContent = 'Read PDF';
                viewButton.onclick = () => {
                    actionModal.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = `/pdf?path=${encodeURIComponent(file.path)}`;
                    }, 20);
                };
            } else if (fext === '.epub') {
                viewButton.textContent = 'Read EPUB';
                viewButton.onclick = () => {
                    actionModal.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = `/epub?path=${encodeURIComponent(file.path)}`;
                    }, 20);
                };
            } else if (isComicName(file.path)) {
                viewButton.textContent = 'Read Comic';
                viewButton.onclick = () => {
                    actionModal.style.display = 'none';
                    // small delay so modal closing paint completes
                    setTimeout(async () => {
                        try { await openComicReader(file); }
                        catch (err) { console.error('openComicReader error', err); alert('Failed to open comic: ' + (err && err.message)); }
                    }, 20);
                };
            } else if (isAudioName(file.path)) {
                viewButton.textContent = 'Listen';
                viewButton.onclick = () => { actionModal.style.display = 'none'; setTimeout(() => openAudioPlayer(file), 20); };
            } else {
                viewButton.textContent = 'Download';
                viewButton.onclick = () => { actionModal.style.display = 'none'; setTimeout(() => downloadFile(file.path, file.name), 20); };
            }

            // the modal is reused: when downloads are disabled, hide the view
            // button only while it acts as a Download fallback
            viewButton.style.display = (window.__dlDisabled && viewButton.textContent === 'Download') ? 'none' : '';

            downloadButton.onclick = () => { actionModal.style.display = 'none'; setTimeout(() => downloadFile(file.path, file.name), 20); };
            actionModal.style.display = 'flex';
        }
        function closeActionModal() { actionModal.style.display = 'none'; }
        actionCancelBtn.addEventListener('click', closeActionModal);

        /* Search & Sort */
        function applyFilters() {
            const query = searchInput.value.toLowerCase().trim();
            const sort = sortSelect.value;
            filtered = library.filter(item => (item.name || '').toLowerCase().includes(query));
            if (sort === 'nameAsc') filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            else if (sort === 'nameDesc') filtered.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
            renderGrid();
        }
        searchInput.addEventListener('input', applyFilters);
        sortSelect.addEventListener('change', applyFilters);

        /* EPUB Reader */
        async function openEpubReader(file) {
            currentBook = file;
            readerTitle.textContent = file.name || 'Book';
            readerContainer.classList.add('active');
            epubViewer.innerHTML = '<p style="padding:20px;text-align:center;color:var(--muted)">Loading EPUB…</p>';

            try {
                const book = ePub(fileUrlDirect(file.path));
                rendition = book.renderTo(epubViewer, { width: '100%', height: '100%', flow: epubFlow, spread: 'auto' });

                const resume = findResume(file);
                let startCfi = null;
                if (resume && resume.entry && resume.entry.cfi) startCfi = resume.entry.cfi;

                await rendition.display(startCfi || undefined);
                rendition.themes.fontSize(`${epubFontSize}%`);

                book.loaded.navigation.then(nav => {
                    tocContent.innerHTML = '';
                    if (nav.toc && nav.toc.length) {
                        nav.toc.forEach(chapter => {
                            const link = document.createElement('a');
                            link.className = 'toc-item';
                            link.textContent = chapter.label;
                            link.href = '#';
                            link.onclick = (e) => { e.preventDefault(); rendition.display(chapter.href); tocPanel.classList.remove('open'); };
                            tocContent.appendChild(link);
                            if (chapter.subitems) {
                                chapter.subitems.forEach(sub => {
                                    const subLink = document.createElement('a');
                                    subLink.className = 'toc-item toc-sub';
                                    subLink.textContent = sub.label;
                                    subLink.href = '#';
                                    subLink.onclick = (e) => { e.preventDefault(); rendition.display(sub.href); tocPanel.classList.remove('open'); };
                                    tocContent.appendChild(subLink);
                                });
                            }
                        });
                    } else {
                        tocContent.innerHTML = '<p style="padding:12px;color:var(--muted)">No table of contents available.</p>';
                    }
                });

                rendition.on('relocated', (location) => {
                    const percent = book.locations.percentageFromCfi(location.start.cfi);
                    progressInfo.textContent = Math.round(percent * 100) + '%';
                    const store = readResume();
                    const key = fileKey(file.path, file.sz, file.mt);
                    store[key] = { cfi: location.start.cfi, percent: Math.round(percent * 100), time: Date.now() };
                    writeResume(store);
                    updateResumeBadge(file, Math.round(percent * 100), 'percent');
                });

                prevBtn.onclick = () => rendition.prev();
                nextBtn.onclick = () => rendition.next();

                rendition.on('keyup', (e) => {
                    if (e.key === 'ArrowLeft') rendition.prev();
                    else if (e.key === 'ArrowRight') rendition.next();
                });

            } catch (err) {
                console.error('EPUB load error', err);
                epubViewer.innerHTML = '<p style="padding:20px;text-align:center;color:red">Failed to load EPUB.</p>';
            }
        }

        closeReaderBtn.addEventListener('click', () => {
            readerContainer.classList.remove('active');
            if (rendition) { rendition.destroy(); rendition = null; }
            epubViewer.innerHTML = '';
            currentBook = null;
        });

        tocBtn.addEventListener('click', () => tocPanel.classList.toggle('open'));
        closeToc.addEventListener('click', () => tocPanel.classList.remove('open'));

        fontUpBtn.addEventListener('click', () => {
            epubFontSize = Math.min(200, epubFontSize + 10);
            if (rendition) rendition.themes.fontSize(`${epubFontSize}%`);
            localStorage.setItem('nomad_epub_font_pct', epubFontSize);
        });

        fontDownBtn.addEventListener('click', () => {
            epubFontSize = Math.max(80, epubFontSize - 10);
            if (rendition) rendition.themes.fontSize(`${epubFontSize}%`);
            localStorage.setItem('nomad_epub_font_pct', epubFontSize);
        });

        viewModeBtn.addEventListener('click', () => {
            epubFlow = epubFlow === 'paginated' ? 'scrolled-doc' : 'paginated';
            localStorage.setItem('nomad_epub_flow', epubFlow);
            viewModeBtn.textContent = epubFlow === 'paginated' ? 'Pages' : 'Scroll';
            if (currentBook) openEpubReader(currentBook);
        });
        viewModeBtn.textContent = epubFlow === 'paginated' ? 'Pages' : 'Scroll';

        /* comics open in comics.html, which streams pages instead of loading the whole archive here */
        async function openComicReader(file) {
            window.location.href = `/comics?path=${encodeURIComponent(file.path)}`;
        }

        /* Audio Player */
        let currentAudio = null;
        let speeds = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
        let speedIndex = 2;

        function openAudioPlayer(file) {
            currentAudio = file;
            audioTitle.textContent = file.name || 'Audiobook';
            audioElement.pause();
            audioElement.src = fileUrlDirect(file.path);
            try { audioElement.load(); } catch(e){}
            audioPlayer.classList.add('active');
            updateAudioHeight();

            const resume = findResume(file);
            if (resume && resume.entry && resume.entry.time) {
                audioElement.currentTime = resume.entry.time;
            }

            audioElement.play();
            playPauseBtn.classList.add('playing');
        }

        document.getElementById('closeAudio').addEventListener('click', () => {
            audioPlayer.classList.remove('active');
            audioElement.pause();
            audioElement.src = '';
            currentAudio = null;
            updateAudioHeight();
        });

        playPauseBtn.addEventListener('click', () => {
            if (audioElement.paused) audioElement.play();
            else audioElement.pause();
        });

        document.getElementById('rewind').addEventListener('click', () => {
            audioElement.currentTime = Math.max(0, audioElement.currentTime - 15);
        });

        document.getElementById('forward').addEventListener('click', () => {
            audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + 15);
        });

        speedBtn.addEventListener('click', () => {
            speedIndex = (speedIndex + 1) % speeds.length;
            audioElement.playbackRate = speeds[speedIndex];
            speedBtn.textContent = speeds[speedIndex] + 'x';
        });

        audioElement.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioElement.duration);
        });

        // Position is written on a timer, not on every timeupdate. timeupdate fires about
        // four times a second and each one re-parsed and rewrote the whole resume store,
        // then scanned the grid for the card.
        let lastAudioSave = 0;
        function saveAudioPosition(force) {
            if (!currentAudio || !(audioElement.duration > 0)) return;
            const now = Date.now();
            if (!force && now - lastAudioSave < 5000) return;
            lastAudioSave = now;
            const store = readResume();
            const key = fileKey(currentAudio.path, currentAudio.sz, currentAudio.mt);
            store[key] = {
                time: audioElement.currentTime,
                duration: audioElement.duration,
                percent: Math.round((audioElement.currentTime / audioElement.duration) * 100),
                timestamp: now
            };
            writeResume(store);
            updateResumeBadge(currentAudio, audioElement.currentTime, 'time');
        }

        audioElement.addEventListener('timeupdate', () => {
            currentTimeEl.textContent = formatTime(audioElement.currentTime);
            const percent = (audioElement.currentTime / audioElement.duration) * 100;
            audioProgressFill.style.width = percent + '%';
            saveAudioPosition(false);
        });

        // the throttle above could otherwise drop the last few seconds
        audioElement.addEventListener('pause', () => saveAudioPosition(true));
        // drive the icon off the element, so it stays right no matter what
        // paused playback (end of file, another tab, headphone controls)
        audioElement.addEventListener('play',  () => playPauseBtn.classList.add('playing'));
        audioElement.addEventListener('pause', () => playPauseBtn.classList.remove('playing'));
        audioElement.addEventListener('ended', () => playPauseBtn.classList.remove('playing'));
        audioElement.addEventListener('ended', () => saveAudioPosition(true));
        window.addEventListener('pagehide', () => saveAudioPosition(true));

        audioProgressBar.addEventListener('click', (e) => {
            const rect = audioProgressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioElement.currentTime = percent * audioElement.duration;
        });

        /* Init */
        (async function init() {
            try {
                library = await buildLibrary();
                filtered = library;
                renderGrid();
            } catch (err) {
                console.error('Failed to load library', err);
                gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:red;padding:20px">Failed to load library.</p>';
            }
        })();
    
/* admin toggle: hide download actions when downloads are disabled (the
   fallback 'Download' view-button is handled where the modal is populated) */
NomadUI.applyDownloadPolicy('downloadButton');
NomadUI.config().then(c => { window.__dlDisabled = !!c.downloadsDisabled; });
</script>
<script>
/* Khan-Nomad books page: filter chips, format badges, reading progress and the
   continue-reading card. It wraps renderGrid, openListModal, loadDirContents,
   openActionModal and updateResumeBadge from the script above instead of
   replacing them, so search, sort, view sizes and opening work as before. */
(function () {
    // where the readers keep their place (read only here, never written)
    const EPUB_KEY = 'nomad_epub_progress_';   // epub.html:   {cfi, percent, time}
    const PDF_KEY = 'nomad_pdf_progress_';     // pdf.html:    {page, time}, no page count
    const COMIC_KEY = 'comic_page_';           // comics.html: 0-based page index, no time
    // audiobooks (and the old in-page epub reader) use RESUME_KEY from the script above
    const OPENED_KEY = 'khan_books_opened_v1'; // this page: when an item was last opened from here
    const CAT_KEY = 'khan_books_cat';
    const COMIC_ALL = ['.cbz', '.cbr', '.cbt', '.cb7'];

    const mainEl = document.querySelector('main');
    const wrapEl = document.querySelector('.grid-wrapper');

    /* ---- elements ---- */
    const chips = document.createElement('div');
    chips.className = 'kn-chips';
    chips.setAttribute('role', 'group');
    chips.setAttribute('aria-label', 'Filter by type');
    chips.hidden = true;
    [['all', 'All'], ['books', 'Books'], ['comics', 'Comics'], ['audio', 'Audio']].forEach(([cat, label]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'kn-chip';
        b.dataset.cat = cat;
        b.textContent = label;
        chips.appendChild(b);
    });

    const keep = document.createElement('section');
    keep.className = 'kn-keep';
    keep.hidden = true;
    keep.innerHTML =
        '<span class="kn-keep-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h11a1 1 0 0 1 1 1v17l-6.5-4.2L5.5 21V4a1 1 0 0 1 1-1z"/></svg></span>' +
        '<div class="kn-keep-body"><div class="kn-keep-label"></div><div class="kn-keep-title"></div>' +
        '<div class="kn-keep-meta"></div><div class="kn-progress" aria-hidden="true"><i></i></div></div>' +
        '<button type="button" class="kn-keep-btn"></button>';
    const keepLabel = keep.querySelector('.kn-keep-label');
    const keepTitle = keep.querySelector('.kn-keep-title');
    const keepMeta = keep.querySelector('.kn-keep-meta');
    const keepBar = keep.querySelector('.kn-progress');
    const keepBtn = keep.querySelector('.kn-keep-btn');

    if (mainEl && wrapEl) { mainEl.insertBefore(chips, wrapEl); mainEl.insertBefore(keep, wrapEl); }

    /* ---- state ---- */
    let activeCat = 'all';
    try { activeCat = localStorage.getItem(CAT_KEY) || 'all'; } catch (e) { }
    let libByPath = new Map();   // top-level library items by path
    let prog = new Map();        // reading progress by path
    let listFiles = null;        // {dir, files} from the last folder listing
    let listByPath = new Map();  // items in the open folder sheet by path
    let keepRec = null;

    /* ---- helpers ---- */
    function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
    function dec(s) { try { return decodeURIComponent(s); } catch (e) { return null; } }
    function opened() { const o = readJSON(OPENED_KEY); return (o && typeof o === 'object') ? o : {}; }
    function record(path, name, sz, mt) {
        try {
            const o = opened();
            o[normalizePath(path)] = { n: name || '', sz: sz || 0, mt: mt || 0, t: Date.now() };
            const keys = Object.keys(o);
            if (keys.length > 60) keys.sort((a, b) => (o[a].t || 0) - (o[b].t || 0)).slice(0, keys.length - 60).forEach(k => delete o[k]);
            localStorage.setItem(OPENED_KEY, JSON.stringify(o));
        } catch (e) { }
    }
    function catOfPath(p) {
        const e = ext(String(p).split('/').pop());
        if (COMIC_ALL.includes(e)) return 'comics';
        if (AUDIO_EXTS.includes(e)) return 'audio';
        return 'books';
    }
    function catOf(it) {
        if (it.type === 'dir') return it.isComic ? 'comics' : 'books';
        return catOfPath(it.fileEntry ? it.fileEntry.name : '');
    }
    function badgeOf(info) {
        if (info.isDir) return info.isComic ? 'Comic' : 'Series';
        const e = ext(info.fileName || '');
        return e ? e.slice(1).toUpperCase() : '';
    }
    function hue(s) {
        s = String(s || '');
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
        return Math.abs(h) % 4;
    }
    function itemPath(it) { return normalizePath(it.type === 'dir' ? it.dir : (it.fileEntry ? it.fileEntry.path : '')); }
    function infoOf(it) {
        return it.type === 'dir'
            ? { path: it.dir, name: it.name, isDir: true, isComic: !!it.isComic }
            : { path: it.fileEntry.path, name: it.name, fileName: it.fileEntry.name };
    }
    function canRead(p) { const e = ext(p); return e === '.epub' || e === '.pdf' || isComicName(p) || isAudioName(p); }

    /* everything the readers have stored, by normalized path. percent is only
       set where it is really known (epub, audiobooks); pdf and comics keep a page */
    function scan() {
        const map = new Map();
        function put(path, rec) {
            if (!path) return;
            const p = normalizePath(path);
            const old = map.get(p);
            if (!old || (rec.t || 0) >= (old.t || 0)) map.set(p, Object.assign({ path: p }, rec));
        }
        let n = 0;
        try { n = localStorage.length; } catch (e) { }
        for (let i = 0; i < n; i++) {
            let k = null;
            try { k = localStorage.key(i); } catch (e) { }
            if (!k) continue;
            if (k.startsWith(EPUB_KEY)) {
                const r = readJSON(k);
                if (r && r.percent > 0) put(dec(k.slice(EPUB_KEY.length)), { kind: 'read', percent: r.percent, t: r.time || 0 });
            } else if (k.startsWith(PDF_KEY)) {
                const r = readJSON(k);
                if (r && r.page > 0) put(dec(k.slice(PDF_KEY.length)), { kind: 'read', page: r.page, t: r.time || 0 });
            } else if (k.startsWith(COMIC_KEY)) {
                let idx = 0;
                try { idx = parseInt(localStorage.getItem(k), 10); } catch (e) { }
                if (idx > 0) put(k.slice(COMIC_KEY.length), { kind: 'read', page: idx + 1, comic: true, t: 0 });
            }
        }
        const store = readResume();
        for (const key of Object.keys(store)) {
            const e = store[key];
            if (!e) continue;
            const parts = key.split('|');
            if (e.duration > 0) {
                const pct = typeof e.percent === 'number' ? e.percent : ((e.time || 0) / e.duration * 100);
                put(parts[0], { kind: 'listen', percent: pct, t: e.timestamp || 0, sz: +parts[1] || 0, mt: +parts[2] || 0 });
            } else if (e.cfi && e.percent > 0) {
                put(parts[0], { kind: 'read', percent: e.percent, t: e.time || 0 });
            }
        }
        const o = opened();
        map.forEach((rec, p) => {
            const r = o[p];
            if (!r) return;
            if ((r.t || 0) > (rec.t || 0)) rec.t = r.t;
            rec.n = r.n;
            if (!rec.sz) { rec.sz = r.sz || 0; rec.mt = r.mt || 0; }
        });
        return map;
    }

    /* ---- decorating cards ---- */
    function setBar(host, pct, before) {
        let bar = host.querySelector(':scope > .kn-progress');
        if (!(pct >= 1)) { if (bar) bar.remove(); return; }
        if (!bar) {
            bar = document.createElement('div');
            bar.className = 'kn-progress';
            bar.setAttribute('aria-hidden', 'true');
            bar.appendChild(document.createElement('i'));
            host.insertBefore(bar, before || null);
        }
        bar.firstChild.style.width = Math.min(100, Math.round(pct)) + '%';
    }
    function percentFor(info) {
        if (info.isDir) return null;
        const rec = prog.get(normalizePath(info.path));
        return rec && rec.percent != null ? rec.percent : null;
    }
    function decorateCard(card, info) {
        const thumb = card.querySelector('.thumb-wrapper');
        if (thumb) {
            thumb.dataset.knHue = hue(info.name);
            if (!thumb.querySelector('.kn-badge')) {
                const label = badgeOf(info);
                if (label) {
                    const b = document.createElement('span');
                    b.className = 'kn-badge';
                    b.textContent = label;
                    thumb.appendChild(b);
                }
            }
        }
        let title = card.querySelector(':scope > .kn-title');
        if (!title) {
            title = document.createElement('div');
            title.className = 'kn-title';
            title.textContent = info.name || '';
            card.appendChild(title);
        }
        setBar(card, percentFor(info), title);
    }
    function decorateRow(row, info) {
        if (!row.querySelector('.kn-badge')) {
            const label = badgeOf(info);
            if (label) {
                const b = document.createElement('span');
                b.className = 'kn-badge inline';
                b.textContent = label;
                row.insertBefore(b, row.querySelector('.context'));
            }
        }
        setBar(row, percentFor(info), null);
    }
    function decorateGrid() {
        gridEl.querySelectorAll('.media-card[data-path], .book-row[data-path]').forEach(el => {
            const it = libByPath.get(normalizePath(el.dataset.path));
            if (!it) return;
            if (el.classList.contains('book-row')) decorateRow(el, infoOf(it));
            else decorateCard(el, infoOf(it));
        });
    }
    function listInfo(f) {
        return { path: f.path, name: f.name, isDir: !!f.isDir, isComic: !!f.isComic, fileName: String(f.path || '').split('/').pop() };
    }
    function decorateList(dir) {
        if (!listFiles || listFiles.dir !== dir) return;
        const cards = listContainer.querySelectorAll(':scope > .media-card');
        const files = listFiles.files;
        if (cards.length !== files.length) return;
        listByPath = new Map();
        cards.forEach((card, i) => {
            const f = files[i];
            card.dataset.path = f.path;
            listByPath.set(normalizePath(f.path), f);
            decorateCard(card, listInfo(f));
        });
    }

    /* ---- chips ---- */
    function updateChips() {
        const counts = { books: 0, comics: 0, audio: 0 };
        library.forEach(it => { counts[catOf(it)]++; });
        if (activeCat !== 'all' && !counts[activeCat]) activeCat = 'all';
        chips.querySelectorAll('.kn-chip').forEach(b => {
            const c = b.dataset.cat;
            b.hidden = c !== 'all' && !counts[c];
            const on = c === activeCat;
            b.classList.toggle('active', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        chips.hidden = library.length === 0;
    }
    chips.addEventListener('click', (e) => {
        const b = e.target.closest('.kn-chip');
        if (!b || b.dataset.cat === activeCat) return;
        activeCat = b.dataset.cat;
        try { localStorage.setItem(CAT_KEY, activeCat); } catch (err) { }
        applyFilters(); // recomputes search + sort, then renderGrid applies the chip
    });

    /* ---- continue-reading card ---- */
    function renderKeep() {
        let best = null;
        prog.forEach(rec => {
            const p = rec.path;
            if (!p.startsWith(ROOT + '/')) return;
            // skip progress for files no longer on the card
            const top = ROOT + '/' + p.slice(ROOT.length + 1).split('/')[0];
            if (!libByPath.has(normalizePath(top))) return;
            const going = rec.percent != null ? (rec.percent >= 1 && rec.percent < 99) : (rec.page > 1);
            if (!going) return;
            const cat = rec.comic ? 'comics' : catOfPath(p);
            if (activeCat !== 'all' && cat !== activeCat) return;
            if (!best || (rec.t || 0) > (best.t || 0)) best = rec;
        });
        if (!best) { keep.hidden = true; keepRec = null; return; }

        const lib = libByPath.get(best.path);
        const base = best.path.split('/').pop();
        const name = (lib && lib.name) || best.n || (ext(base) ? prettify(base) : base);
        const listen = best.kind === 'listen';
        keepLabel.textContent = listen ? 'Continue listening' : 'Continue reading';
        keepTitle.textContent = name;
        if (best.percent != null) {
            const pct = Math.round(best.percent);
            keepMeta.textContent = listen ? `${pct}% listened` : `${pct}% read`;
            keepBar.hidden = false;
            keepBar.firstChild.style.width = Math.min(100, pct) + '%';
        } else {
            keepMeta.textContent = `Page ${best.page}`;
            keepBar.hidden = true;
        }
        keepBtn.textContent = listen ? 'Listen' : 'Read';
        keepRec = Object.assign({}, best, { name });
        keep.hidden = false;
    }
    // opens the item the same way its cover does, then takes the reading
    // action straight away (no "what do you want to do" step)
    keepBtn.addEventListener('click', () => {
        const r = keepRec;
        if (!r) return;
        const p = r.path;
        if (r.comic) {
            record(p, r.name);
            window.location.href = `/comics?path=${encodeURIComponent(p)}`;
            return;
        }
        const lib = libByPath.get(p);
        const file = (lib && lib.type === 'file') ? lib.fileEntry : { name: r.name, path: p, sz: r.sz || 0, mt: r.mt || 0 };
        openActionModal(file);
        if (canRead(p)) viewButton.click();
    });

    let refreshTimer = 0;
    function refresh() {
        prog = scan();
        decorateGrid();
        listContainer.querySelectorAll(':scope > .media-card[data-path]').forEach(card => {
            const f = listByPath.get(normalizePath(card.dataset.path));
            if (f) setBar(card, percentFor(listInfo(f)), card.querySelector(':scope > .kn-title'));
        });
        renderKeep();
    }
    function refreshSoon() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 300); }

    /* ---- hooks into the page script ---- */
    const origRender = renderGrid;
    renderGrid = function () {
        libByPath = new Map();
        library.forEach(it => libByPath.set(itemPath(it), it));
        updateChips();
        if (activeCat !== 'all') filtered = filtered.filter(it => catOf(it) === activeCat);
        const out = origRender.apply(this, arguments);
        prog = scan();
        decorateGrid();
        renderKeep();
        return out;
    };

    const origLoadDir = loadDirContents;
    loadDirContents = async function (dir) {
        const r = await origLoadDir.apply(this, arguments);
        listFiles = { dir, files: (r && r.files) || [] };
        return r;
    };

    const origOpenList = openListModal;
    openListModal = async function (item) {
        const out = await origOpenList.apply(this, arguments);
        prog = scan();
        decorateList(item && item.dir);
        return out;
    };

    const origOpenAction = openActionModal;
    openActionModal = function (file) {
        const out = origOpenAction.apply(this, arguments);
        const sub = document.getElementById('actionSub');
        if (sub && file) {
            const e = ext(file.path || file.name || '');
            const bits = [];
            if (e) bits.push(e.slice(1).toUpperCase());
            if (file.sz) bits.push(formatBytes(file.sz));
            sub.textContent = bits.join(' · ');
        }
        return out;
    };

    // the audiobook player saves its place through this every few seconds
    const origBadge = updateResumeBadge;
    updateResumeBadge = function () {
        const out = origBadge.apply(this, arguments);
        refreshSoon();
        return out;
    };

    // remember when something was opened from here, so the card can pick the latest
    viewButton.addEventListener('click', () => {
        const f = currentItem;
        if (f && f.path && canRead(f.path)) record(f.path, f.name, f.sz, f.mt);
    });
    gridEl.addEventListener('click', (e) => {
        const el = e.target.closest('[data-path]');
        const it = el && libByPath.get(normalizePath(el.dataset.path));
        if (it && it.type === 'dir' && it.isComic) record(it.dir, it.name);
    });
    listContainer.addEventListener('click', (e) => {
        const el = e.target.closest('[data-path]');
        const f = el && listByPath.get(normalizePath(el.dataset.path));
        if (f && f.isDir && f.isComic) record(f.path, f.name);
    });

    // coming back from a reader through the back/forward cache skips init
    window.addEventListener('pageshow', (e) => { if (e.persisted && library.length) { updateChips(); refresh(); } });
})();
</script>
</body>
</html>
