<!DOCTYPE html>
<!-- Version 4 -->
<html lang="en">
<head>
    <link rel="stylesheet" href="/master.css">
    <script src="/theme-boot.js"></script>
    <script src="/nomad-utils.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nomad • Books</title>
    <!-- Books page supports epub, audiobook, and PDF formats. Comics (CBZ/CBR/folder) open in comics.html. -->
    <script src="/assets/epub.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html, body {
            height: 100%
        }

        body {
            font-family: Arial,Helvetica,sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh
        }

            body.dark {
                background: var(--bg);
                color: var(--text);
            }

                body.dark .toolbar {
                    background: var(--bg);
                    border-bottom-color: var(--white-alpha-4);
                }

                body.dark .media-card {
                    background: var(--card);
                    box-shadow: var(--shadow-medium);
                }
                body.dark .back-btn { background: var(--white-alpha-12); color: var(--color-white); }
                body.dark .view-btn.active { border-color: var(--primary); }

                body.dark .overlay-title {
                    color: var(--text);
                }

                body.dark .modal-content, body.dark .list-modal-content {
                    background: var(--card);
                    color: var(--text);
                }

                body.dark .reader-container {
                    background: var(--card);
                    color: var(--text);
                }

                body.dark .reader-header {
                    background: var(--card);
                }

                body.dark .reader-navigation {
                    background: var(--card);
                    border-top-color: var(--white-alpha-4);
                }

                body.dark .toc-panel {
                    background: var(--card);
                    border-left: 1px solid var(--white-alpha-6);
                }

                body.dark .audio-player {
                    background: var(--card);
                    backdrop-filter: blur(10px);
                    border-top-color: var(--white-alpha-8);
                }

                body.dark .progress-bar-container {
                    background: var(--progress-dark);
                }

                body.dark .time-info {
                    color: var(--time-dark);
                }

        header {
            position: sticky;
            top: 0;
            z-index: 60;
        }

            header h1 {
                font-size: clamp(1.25rem,4vw,1.75rem);
                margin: 0
            }

        .back-btn {
            text-decoration: none;
            color: #fff;
            background: var(--primary-dark);
            padding: .5rem .75rem;
            border-radius: var(--radius);
            font-size: .95rem
        }

        .toolbar {
            background: var(--bg);
            padding: .65rem 1rem;
            display: flex;
            flex-wrap: nowrap;
            gap: .6rem;
            align-items: center;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: var(--header-height);
            z-index: 55;
            }

            .toolbar input[type="search"] {
            flex: 1;
            padding: .5rem .75rem;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: 0.95rem;
            background: var(--card);
            color: var(--text);
            }

            .toolbar select, .toolbar .view-btn {
                padding: .48rem .7rem;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--text);
                border-radius: var(--radius);
                font-size: 0.9rem;
                cursor: pointer;
            }

        .view-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary-dark);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: calc(1rem + var(--audio-height));
        }

        .grid-wrapper {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px
        }

        .media-grid {
            display: grid;
            gap: 1rem;
        }

            .media-grid.small {
                grid-template-columns: repeat(auto-fit,minmax(120px,1fr));
            }

            .media-grid.medium {
                grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
            }

            .media-grid.large {
                grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            }

        .media-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .25s ease;
            cursor: pointer;
        }

        .media-card:hover {
            transform: translateY(-4px);
        }

        @media (max-width: 768px) {
            .media-grid.medium {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .media-grid.small {
                grid-template-columns: repeat(2, 1fr);
            }

            .media-grid.medium {
                grid-template-columns: repeat(3, 1fr);
            }

            .media-grid.large {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .media-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .25s ease;
            cursor: pointer;
            width: 100%;
            max-width: 220px;
            margin: 0 auto;
        }

        .media-grid.small .media-card {
            max-width: 120px;
        }

        .media-grid.medium .media-card {
            max-width: 160px;
        }

        .media-grid.large .media-card {
            max-width: 220px;
        }

        .media-card.is-directory .thumb-wrapper {
            box-sizing: border-box;
        }

        .folder-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 3;
            font-size: 1.2rem;
            opacity: 0.7;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        body.dark .folder-icon {
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        .media-card:hover {
            transform: translateY(-3px);
        }

        .thumb-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #efeff5;
            color: #555;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            aspect-ratio: 2/3;
        }

        .overlay-title {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            text-align: center;
            font-weight: 700;
            color: #06306f;
            pointer-events: none;
            padding: 6px;
        }

        .media-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0;
            transition: opacity .35s ease;
        }

        .badge-resume {
            position: absolute;
            left: 8px;
            bottom: 8px;
            z-index: 4;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .modal, .list-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content, .list-modal-content {
            background: #fff;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            width: 92%;
            max-width: 720px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

            /* action modal: even spacing + theme tokens, matches movies/shows */
            #actionModal .modal-content {
                display: flex;
                flex-direction: column;
                gap: 10px;
                max-width: 480px;
                background: var(--card-bg);
                color: var(--text);
                overflow: visible;
            }
            #actionModal .modal-content h2 { margin: 0; }
            #actionSub { font-size: 0.9rem; color: var(--muted); }

            .list-modal-content .list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
                padding: 12px;
                max-height: 70vh;
                overflow-y: auto;
                text-align: center;
            }

            .list-modal-content .list .media-card {
                max-width: 100%;
                margin: 0;
            }

            .modal-content h2, .list-modal-content h2 {
                margin: 0 0 10px 0
            }

        .btn {
            background: var(--primary);
            color: #fff;
            border: 0;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 6px rgba(2,6,23,0.08);
        }

            .btn.small {
                padding: 8px;
                font-size: .9rem;
                width: auto;
                min-width: 96px;
            }

        .btn-muted {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        .list {
            max-height: 420px;
            overflow: auto;
            text-align: left;
            margin-top: 8px
        }

            .list .item {
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 8px;
                border-bottom: 1px solid #f4f4f9
            }

                .list .item .title {
                    flex: 1
                }

                .list .item .meta {
                    font-size: 0.9rem;
                    color: var(--muted)
                }

        .row-buttons {
            display: flex;
            gap: 8px;
            min-width: 120px
        }

        .no-cover-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .book-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
            background: transparent;
        }

        .book-row:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(10,12,20,0.04);
        }

        body.dark .book-row:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .book-row .book-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .book-row .title {
            font-weight: 700;
            color: var(--primary-dark);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.dark .book-row .title {
            color: var(--primary);
        }

        .book-row .context {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

            .row-buttons button {
                padding: 8px;
                border-radius: 6px;
                border: 0;
                cursor: pointer
            }

        /* EPUB Reader */
        .reader-container {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 2000;
            flex-direction: column;
        }

            .reader-container.active {
                display: flex;
            }

        .reader-header {
            background: var(--header-bg, var(--primary));
            color: #fff;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .reader-title {
            font-size: 1rem;
            font-weight: 700;
            margin-right: auto;
        }

        .reader-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .reader-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
            white-space: nowrap;
        }

            .reader-btn:hover {
                background: rgba(255,255,255,0.3);
            }

        .reader-main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        #epub-viewer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: stretch;
            overflow: hidden;
            background: #fafafa;
        }

        .reader-navigation {
            background: #f5f5f5;
            padding: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
        }

            .nav-btn:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

        .progress-info {
            color: #333;
            font-weight: 600;
        }

        /* TOC slide-in panel */
        .toc-panel {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--reader-sidebar-width);
            max-width: 80%;
            background: #fff;
            border-left: 1px solid #e5e7eb;
            transform: translateX(100%);
            transition: transform .25s ease;
            z-index: 5;
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 20px rgba(0,0,0,0.08);
        }

            .toc-panel.open {
                transform: translateX(0%);
            }

        .toc-header {
            padding: 10px 12px;
            font-weight: 700;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toc-content {
            padding: 8px 6px;
            overflow: auto;
            flex: 1;
        }

        .toc-item {
            display: block;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: #0f1720;
            text-decoration: none;
            font-size: 0.95rem;
        }

            .toc-item:hover {
                background: #eef3ff;
            }

        .toc-sub {
            padding-left: 16px;
        }

        /* Audiobook Player */
        .audio-player {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 -2px 12px rgba(0,0,0,0.15);
            padding: 12px 16px;
            z-index: 1500;
            border-top: 2px solid var(--primary);
        }

            .audio-player.active {
                display: block;
            }

        .audio-player-inner {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .audio-title {
            font-size: 0.95em;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .audio-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .audio-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

            .audio-btn:hover {
                background: var(--primary-dark);
                transform: scale(1.05);
            }

            /* skip buttons: themed glyphs rather than emoji, which render at a
               different size and baseline on every platform */
            .audio-btn.icon {
                width: 40px; height: 40px; padding: 0; border-radius: 50%;
                display: inline-flex; align-items: center; justify-content: center;
                background: transparent; color: var(--primary);
                border: 1px solid var(--line);
            }
            .audio-btn.icon:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
            .audio-btn.icon svg { width: 22px; height: 22px; fill: currentColor; }
            .audio-btn.icon svg text { font-size: 8px; font-weight: 700; fill: currentColor; }

            /* a fixed square with the glyph centered by flex: the old pill sat
               visibly off-center because a text triangle carries side bearing */
            .audio-btn.play-pause {
                width: 52px; height: 52px; padding: 0; border-radius: 50%;
                display: inline-flex; align-items: center; justify-content: center;
            }
            .audio-btn.play-pause svg { width: 24px; height: 24px; fill: currentColor; display: block; }
            .audio-btn.play-pause .ic-pause { display: none; }
            .audio-btn.play-pause.playing .ic-play { display: none; }
            .audio-btn.play-pause.playing .ic-pause { display: block; }

        .audio-progress-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar-container {
            width: 100%;
            height: 7px;
            background: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 0.8em;
        }

        .audio-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .audio-top-row {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .audio-close-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1em;
            padding: 4px 8px;
            transition: color 0.2s ease;
        }

            .audio-close-btn:hover {
                color: var(--primary);
            }

        @media (max-width:768px) {
            .audio-top-row {
                flex-wrap: wrap;
                justify-content: center;
            }

            .audio-title {
                order: 1;
                flex: 1 1 100%;
            }

            .reader-controls {
                width: 100%;
                justify-content: flex-start;
            }
        }

        @keyframes pop-in {
            0% {
                transform: scale(.97);
                opacity: 0
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }
    </style>
    <script src="theme-manager.js"></script>
<link rel="stylesheet" href="/khan-pages.css">
<style id="khan-page">
/* Khan-Nomad books page: book-shaped covers, type badges, reading progress,
   filter chips, the continue-reading card and bottom-sheet modals.
   Sits after khan-pages.css so it wins on equal specificity. */

/* ---- grid: three covers a row on a phone, more as the screen grows ---- */
.media-grid { gap: 20px 14px; }
.media-grid.small  { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
.media-grid.medium { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
.media-grid.large  { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
@media (max-width: 600px) {
  .media-grid { gap: 16px 12px; }
  .media-grid.small  { grid-template-columns: repeat(4, 1fr); }
  .media-grid.medium { grid-template-columns: repeat(3, 1fr); }
  .media-grid.large  { grid-template-columns: repeat(2, 1fr); }
}

/* ---- cards: no box, the cover itself is the book ---- */
body .media-card, body.dark .media-card,
.media-grid.small .media-card, .media-grid.medium .media-card, .media-grid.large .media-card {
  max-width: none;
  margin: 0;
  background: transparent;
  box-shadow: none;
  border-radius: 0;
  overflow: visible;
  transition: transform .2s ease;
}
body .media-card:hover { transform: translateY(-3px); box-shadow: none; }

body .media-card .thumb-wrapper {
  border-radius: 4px 8px 8px 4px;
  overflow: hidden;
  background: linear-gradient(155deg, #2A5468, #1B3A4B);
  color: var(--kn-cream);
  box-shadow: 0 1px 2px rgba(27,58,75,.18), 0 6px 14px -4px rgba(27,58,75,.30);
  transition: box-shadow .2s ease;
}
body .media-card:hover .thumb-wrapper {
  box-shadow: 0 2px 4px rgba(27,58,75,.20), 0 14px 24px -6px rgba(27,58,75,.38);
}
body.dark .media-card .thumb-wrapper { box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 18px -4px rgba(0,0,0,.6); }
/* covers with no picture get one of four cloth colors */
body .media-card .thumb-wrapper[data-kn-hue="1"] { background: linear-gradient(155deg, #C8553D, #9A3E2B); }
body .media-card .thumb-wrapper[data-kn-hue="2"] { background: linear-gradient(155deg, #6E7F45, #4E5C30); }
body .media-card .thumb-wrapper[data-kn-hue="3"] { background: linear-gradient(155deg, #4A4870, #33314F); }
/* thin rules like a printed cover; the picture, when there is one, sits on top */
body .media-card .thumb-wrapper::before {
  content: "";
  position: absolute;
  left: 12px; right: 8px; top: 9%; bottom: 9%;
  border-top: 1px solid rgba(244,233,212,.35);
  border-bottom: 1px solid rgba(244,233,212,.35);
  pointer-events: none;
}
/* spine: a darker strip down the left edge, drawn over the picture */
body .media-card .thumb-wrapper::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: 4px;
  z-index: 3;
  background: rgba(0,0,0,.25);
  box-shadow: 1px 0 0 rgba(255,255,255,.14);
  pointer-events: none;
}
body .media-card .fallback-text {
  font-family: var(--kn-serif);
  font-weight: 600;
  font-size: .86rem;
  line-height: 1.25;
  color: var(--kn-cream);
  padding: 22% 10px 10px 14px;
  overflow: hidden;
  word-break: break-word;
  text-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.media-grid.small .media-card .fallback-text { font-size: .7rem; padding: 18% 6px 6px 9px; }
.media-grid.large .media-card .fallback-text { font-size: 1rem; }

/* series and comic folders: a small stack of books */
.folder-icon { display: none; }
body .media-card.is-directory .thumb-wrapper {
  box-shadow: 4px -4px 0 -1px var(--card-bg), 4px -4px 0 0 var(--kn-line),
              8px -8px 0 -2px var(--card-bg), 8px -8px 0 -1px var(--kn-line),
              0 6px 14px -4px rgba(27,58,75,.30);
}
body .media-card.is-directory:hover .thumb-wrapper {
