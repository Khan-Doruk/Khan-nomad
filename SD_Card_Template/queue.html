<!DOCTYPE html>
<!-- Version 4 -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Queue</title>
<link rel="stylesheet" href="master.css">
<script src="/theme-boot.js"></script>
<script src="/nomad-utils.js"></script>
<script src="theme-manager.js"></script>
<style>
body{margin:0;padding:0;background:var(--bg);font-family:Inter,Arial,sans-serif;}
.toolbar{background:var(--card);padding:.6rem 14px;display:flex;gap:.6rem;align-items:center;justify-content:space-between;border-bottom:1px solid var(--black-alpha-4);position:sticky;top:0;z-index:55;}
.queue-count{color:var(--muted);font-weight:700;font-size:0.95rem;}
.btn{padding:.45rem .65rem;border-radius:8px;border:0;background:var(--card);box-shadow:0 2px 8px var(--black-alpha-4);cursor:pointer;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.btn.danger{background:var(--danger);color:var(--color-white);}
main{padding:14px;max-width:1200px;margin:0 auto;padding-bottom:20px;}
.section{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.section h2{font-size:1.1rem;margin:0 0 12px 0;color:var(--primary);font-weight:800;}
.empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-weight:600;}
.empty-state-icon{font-size:3rem;margin-bottom:12px;opacity:0.3;}
.queue-list{display:flex;flex-direction:column;gap:8px;}
.queue-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--black-alpha-4);border:1px solid var(--black-alpha-4);transition:all 0.2s;cursor:pointer;}
.queue-item:hover{background:var(--primary-alpha-8);border-color:var(--primary-alpha-20);transform:translateY(-2px);}
.queue-item.current{background:var(--primary-alpha-10);border-color:var(--primary);border-width:2px;}
.queue-num{font-weight:800;color:var(--primary);font-size:1rem;min-width:32px;text-align:center;}
.queue-item.current .queue-num{color:var(--primary);}
.queue-info{flex:1;min-width:0;}
.queue-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;}
.queue-context{font-size:0.85rem;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.queue-actions{display:flex;gap:6px;flex-shrink:0;}
.queue-action-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--black-alpha-8);background:var(--card);color:var(--primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-weight:700;}
.queue-action-btn:hover{background:var(--primary);color:var(--color-white);transform:scale(1.08);}
.queue-action-btn.danger:hover{background:var(--danger);color:var(--color-white);}
.queue-action-btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;}
</style>
<link rel="stylesheet" href="/khan-pages.css">
<style id="khan-page">
/* Khan-Nomad queue: flat rows with art, hairline separators */
main{padding:4px 14px 24px;}
.toolbar{background:var(--bg);border-bottom:1px solid var(--kn-line);box-shadow:none;}
.queue-count{font-weight:600;font-size:0.85rem;}
.btn.danger{border-radius:999px;padding:.38rem .85rem;font-size:0.82rem;font-weight:600;box-shadow:none;background:transparent;color:var(--kn-terracotta);border:1px solid var(--kn-terracotta);}
.btn.danger:hover{background:var(--kn-terracotta);color:var(--color-white);}
.section{background:transparent;box-shadow:none;border-radius:0;padding:0;margin:0;}
.section h2{font-family:var(--kn-serif);font-weight:600;font-size:1.05rem;color:var(--text);margin:12px 0 2px;}
.queue-list{gap:0;}
.queue-item{gap:10px;padding:9px 2px;border-radius:0;background:transparent;border:0;border-bottom:1px solid var(--kn-line);}
.queue-item:last-child{border-bottom:0;}
.queue-item:hover{background:var(--kn-sand);border-color:var(--kn-line);transform:none;}
.queue-item.current{background:transparent;border:0;border-bottom:1px solid var(--kn-line);}
.queue-item.current:hover{background:var(--kn-sand);}
.queue-num{min-width:18px;font-size:0.78rem;font-weight:600;color:var(--muted);}
.queue-item.current .queue-num{color:var(--kn-terracotta);}
.queue-title{font-weight:600;font-size:0.95rem;color:var(--text);margin-bottom:1px;}
.queue-item.current .queue-title{color:var(--kn-terracotta);}
.queue-context{font-size:0.8rem;font-weight:500;}
.queue-context:empty{display:none;}
.queue-actions{gap:2px;}
.queue-action-btn{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:12px;}
.queue-action-btn:hover{background:var(--primary);color:var(--color-white);transform:none;}
.queue-action-btn.danger{color:var(--kn-terracotta);}
.queue-action-btn.danger:hover{background:var(--kn-terracotta);color:var(--color-white);}
.empty-state{padding:56px 20px;font-weight:500;font-size:0.92rem;}
.empty-state-icon{display:flex;justify-content:center;font-size:0;margin-bottom:12px;opacity:1;color:var(--kn-terracotta);}
.empty-state-icon svg{opacity:0.75;}
.kn-art{position:relative;flex:none;width:36px;height:36px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.88);}
.kn-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.kn-eq{display:none;flex:none;color:var(--kn-terracotta);}
.queue-item.current .kn-eq{display:block;}
.kn-eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:kn-eq 0.9s ease-in-out infinite;}
.kn-eq rect:nth-child(2){animation-delay:-0.3s;}
.kn-eq rect:nth-child(3){animation-delay:-0.6s;}
body.kn-paused .kn-eq rect{animation-play-state:paused;}
@keyframes kn-eq{0%,100%{transform:scaleY(0.35);}50%{transform:scaleY(1);}}
@media (prefers-reduced-motion:reduce){.kn-eq rect{animation:none;}}
</style>
<script src="/i18n.js"></script>
</head>
<body>

<div class="toolbar">
  <div id="queueCount" class="queue-count">0 in queue</div>
  <button id="clearQueueBtn" class="btn danger" style="display:none;">Clear Queue</button>
</div>

<main>
  <section class="section">
    <h2>Queue</h2>
    <div id="queueList" class="queue-list"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-state-icon"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></div>
      <div>Queue is empty. Add songs from other tabs!</div>
    </div>
  </section>
</main>

<script>
let queue = [];
let queueIndex = 0;
let currentMode = 'playlist';
let originalQueue = [];
let queueSortMode = 'added';
let isQueueShuffled = false;

// the list on screen can be sorted or shuffled but the player still works in the
// order tracks were added. queueOrigIdx maps a row back to the player's index
let queueOrigIdx = [];

function buildView(){
  const idxs = originalQueue.map((_, i) => i);
  const nameOf = (i) => (originalQueue[i] && originalQueue[i].name) || '';
  if(queueSortMode === 'asc'){
    idxs.sort((a,b) => nameOf(a).localeCompare(nameOf(b), undefined, {numeric: true}));
  } else if(queueSortMode === 'desc'){
    idxs.sort((a,b) => nameOf(b).localeCompare(nameOf(a), undefined, {numeric: true}));
  } else if(queueSortMode === 'shuffled'){
    fisherYates(idxs);
  }
  queueOrigIdx = idxs;
  queue = idxs.map(i => originalQueue[i]);
}

const queueListEl = document.getElementById('queueList');
const queueCountEl = document.getElementById('queueCount');
const clearQueueBtn = document.getElementById('clearQueueBtn');
const emptyStateEl = document.getElementById('emptyState');

function moveItem(fromIdx, toIdx){
  if(fromIdx < 0 || fromIdx >= queue.length || toIdx < 0 || toIdx >= queue.length) return;
  if(fromIdx === toIdx) return;

  window.parent.postMessage({
    type: 'MOVE_QUEUE',
    payload: { fromIdx, toIdx }
  }, '*');
}


function render(){
  queueListEl.innerHTML = '';
  queueCountEl.textContent = `${queue.length} in queue`;
  
  if(queue.length === 0){
    emptyStateEl.style.display = 'block';
    clearQueueBtn.style.display = 'none';
    return;
  }
  
  emptyStateEl.style.display = 'none';
  clearQueueBtn.style.display = 'block';
  
  // reordering only makes sense against the real order, and a sorted view
  // would just snap back, so the arrows are off unless we are in added order
  const canReorder = (queueSortMode === 'added');

  queue.forEach((track, idx) => {
    const orig = queueOrigIdx.length ? queueOrigIdx[idx] : idx;
    const item = document.createElement('div');
    item.className = 'queue-item';
    if(currentMode === 'queue' && orig === queueIndex) item.classList.add('current');
    
    const num = document.createElement('div');
    num.className = 'queue-num';
    num.textContent = idx + 1;
    
    const info = document.createElement('div');
    info.className = 'queue-info';
    
    const title = document.createElement('div');
    title.className = 'queue-title';
    title.textContent = track.name || 'Unknown';
    
    const context = document.createElement('div');
    context.className = 'queue-context';
    context.textContent = track.display || '';
    
    info.appendChild(title);
    info.appendChild(context);
    
    const actions = document.createElement('div');
    actions.className = 'queue-actions';
    
    const upBtn = document.createElement('button');
    upBtn.className = 'queue-action-btn';
    upBtn.textContent = '▲';
    upBtn.title = canReorder ? 'Move up' : 'Sort by Added order to reorder';
    if(idx === 0 || !canReorder) upBtn.disabled = true;
    upBtn.onclick = (e) => {
      e.stopPropagation();
      if(canReorder && idx > 0) moveItem(queueOrigIdx[idx], queueOrigIdx[idx - 1]);
    };
    
    const downBtn = document.createElement('button');
    downBtn.className = 'queue-action-btn';
    downBtn.textContent = '▼';
    downBtn.title = canReorder ? 'Move down' : 'Sort by Added order to reorder';
    if(idx === queue.length - 1 || !canReorder) downBtn.disabled = true;
    downBtn.onclick = (e) => {
      e.stopPropagation();
      if(canReorder && idx < queue.length - 1) moveItem(queueOrigIdx[idx], queueOrigIdx[idx + 1]);
    };
    
    const removeBtn = document.createElement('button');
    removeBtn.className = 'queue-action-btn danger';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove';
    removeBtn.onclick = (e) => {
      e.stopPropagation();
      window.parent.postMessage({
        type: 'REMOVE_FROM_QUEUE',
        payload: { index: orig }
      }, '*');
    };
    
    actions.appendChild(upBtn);
    actions.appendChild(downBtn);
    actions.appendChild(removeBtn);
    
    item.appendChild(num);
    item.appendChild(info);
    item.appendChild(actions);
    
    item.onclick = () => {
      window.parent.postMessage({
        type: 'PLAY_QUEUE',
        payload: { startIndex: orig }
      }, '*');
    };
    
    queueListEl.appendChild(item);
  });
}

clearQueueBtn.addEventListener('click', () => {
  window.parent.postMessage({
    type: 'CLEAR_QUEUE',
    payload: {}
  }, '*');
});

window.addEventListener('message', (event) => {
  const { type, payload } = event.data;

  if(type === 'QUEUE_UPDATE'){
    originalQueue = payload.queue || [];
    queueIndex = payload.queueIndex || 0;
    currentMode = payload.mode || 'playlist';

    // Apply current sort mode to new queue data
    buildView();

    render();
  }

  if(type === 'SHUFFLE'){
    queueSortMode = (queueSortMode === 'shuffled') ? 'added' : 'shuffled';
    buildView();
    render();
  }

  if(type === 'SORT'){
    if(payload.mode === 'added'){
      queueSortMode = 'added';
    } else {
      queueSortMode = payload.ascending ? 'asc' : 'desc';
    }
    buildView();
    render();
  }
});

window.parent.postMessage({
  type: 'REQUEST_QUEUE_UPDATE',
  payload: {}
}, '*');

render();
</script>
<script>
/* Khan-Nomad queue: art squares and the playing highlight.
 * Album art comes from the songs tab (it already knows every image in /Music). */
(function(){
  const PALETTE = ['#D97B4A','#234B61','#C8553D','#B9612F','#7A6F60','#1B3A4B'];
  const NOTE_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>';
  const EQ_SVG = '<svg class="kn-eq" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="3" height="11" rx="1"></rect><rect x="6.5" y="3" width="3" height="11" rx="1"></rect><rect x="11" y="3" width="3" height="11" rx="1"></rect></svg>';

  function songsWin(){
    try {
      if(window.parent === window) return null;
      const f = window.parent.document.getElementById('songsFrame');
      return f ? f.contentWindow : null;
    } catch(e){ return null; }
  }
  function trackArt(p){ const w = songsWin(); return (w && w.knArtUrl) ? w.knArtUrl(p) : null; }
  function albumOf(p){
    const parts = normalizePath(p || '').split('/').filter(Boolean);
    return parts.length > 1 ? parts[parts.length - 2] : 'Music';
  }
  function color(name){
    let h = 5381; name = String(name || '');
    for(let i = 0; i < name.length; i++) h = ((h << 5) + h + name.charCodeAt(i)) | 0;
    return PALETTE[Math.abs(h) % PALETTE.length];
  }
  const artTpl = document.createElement('div');
  artTpl.className = 'kn-art';
  artTpl.setAttribute('aria-hidden', 'true');
  artTpl.innerHTML = NOTE_SVG;
  const eqTpl = document.createElement('div');
  eqTpl.innerHTML = EQ_SVG;
  const eqNode = eqTpl.firstChild;

  function artEl(path){
    const d = artTpl.cloneNode(true);
    d.style.backgroundColor = color(albumOf(path));
    const url = trackArt(path);
    if(url){
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = '';
      img.onerror = function(){ this.remove(); };
      img.src = url;
      d.appendChild(img);
    }
    return d;
  }

  const origRender = render;
  render = function(){
    const r = origRender.apply(this, arguments);
    queueListEl.querySelectorAll('.queue-item').forEach((item, idx) => {
      const track = queue[idx];
      if(!track) return;
      const num = item.querySelector('.queue-num');
      item.insertBefore(artEl(track.path), num ? num.nextSibling : item.firstChild);
      const ctx = item.querySelector('.queue-context');
      if(ctx && !ctx.textContent) ctx.textContent = albumOf(track.path);
      item.insertBefore(eqNode.cloneNode(true), item.querySelector('.queue-actions'));
    });
    return r;
  };

  window.addEventListener('message', (event) => {
    const d = event.data || {};
    if(d.type === 'PLAYBACK_UPDATE' && d.payload){
      document.body.classList.toggle('kn-paused', !d.payload.playing);
    } else if(d.type === 'KN_ART_READY'){
      render();
    } else if(d.type === 'KN_QUEUE_POS' && d.payload){
      // playing position changed without a queue change: move the highlight,
      // keep the current (maybe shuffled) order on screen
      queueIndex = d.payload.queueIndex || 0;
      currentMode = d.payload.mode || 'playlist';
      render();
    }
  });
})();
</script>
</body>
</html>
