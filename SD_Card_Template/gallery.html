<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nomad • Gallery</title>
  <meta name="description" content="Khan-Nomad Media Server – Images & Video" />

  <style>
    /* Functional CSS: Gallery-specific layout and positioning */
    body { display: flex; flex-direction: column; min-height: 100vh; padding: 0 .5rem; overflow-x: hidden; }

    header {
      margin-left: -.5rem;
      margin-right: -.5rem;
      padding-left: calc(1rem + .5rem);
      padding-right: calc(1rem + .5rem);
      position: sticky;
      top: 0;
      z-index: 60;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .toolbar {
      padding: .75rem 1rem;
      display: flex;
      gap: .75rem;
      align-items: center;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: var(--header-height);
      z-index: 55;
      justify-content: flex-end;
      flex-wrap: wrap;
      background: var(--bg);
    }
    .toolbar-left { margin-right: auto; display: flex; gap: .5rem; align-items: center; }
    .toolbar select, .toolbar input[type='number'], .toolbar .view-btn, .toolbar .btn {
      padding: .45rem .65rem;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: .9rem;
    }
    .view-btn.active { background: var(--primary); color: var(--header-text); border-color: var(--primary-dark); }

    main { flex: 1; display: flex; flex-direction: column; max-width: 1200px; width: 100%; margin: 0 auto; overflow-x: hidden; }
    .grid-wrapper { flex: 1; overflow-y: auto; padding: 1rem; }
    .media-grid { display: grid; gap: 1rem; justify-content: center; width: 100%; box-sizing: border-box; }
    .media-grid.small { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
    .media-grid.medium { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .media-grid.large { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

    .media-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .25s ease;
      cursor: pointer;
      position: relative;
      width: 100%;
      aspect-ratio: 1/1;
      max-width: 100%;
      box-sizing: border-box;
    }
    .media-card:hover { transform: translateY(-3px); }
    .media-thumb { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: .9;
      font-size: 3rem;
      color: var(--header-text);
      text-shadow: 0 0 10px black;
      z-index: 2;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      padding: .3em .4em;
    }
    .spinner {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 6;
    }
    .spinner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }

    .modal-content {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      width: 90vw;
      height: 90vh;
      padding: 1rem;
      background: #000;
      color: var(--header-text);
      display: flex;
      flex-direction: column;
    }
    #modalMedia { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #modalMedia img, #modalMedia video { width: 100%; height: 100%; object-fit: contain; }
    /* Plyr wraps the <video> in its own container; let it fill the modal */
    #modalMedia .plyr { width: 100%; max-height: 100%; --plyr-color-main: var(--primary); }
    #modalMedia .plyr__video-wrapper { height: 100%; }
    .modal-info { flex: 0 0 auto; padding: 1rem 0 0; overflow-y: auto; max-height: 25vh; color: rgba(255,255,255,0.75); font-size: .95rem; }
    .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: var(--header-text);
      border: none;
      font-size: 1.5rem;
      padding: .2rem .5rem;
      border-radius: 50%;
      cursor: pointer;
    }
    .pager { display: flex; justify-content: center; align-items: center; padding: 1rem; gap: 1rem; flex-wrap: wrap; }

    @media (max-width: 768px) {
      .media-grid.small { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
      .media-grid.medium { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .media-grid.large { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
    body.dark .back-btn { background: rgba(255,255,255,0.12); color: var(--header-text); }
    body.dark .view-btn.active { border-color: var(--primary); }
  </style>

<body data-page="gallery">
  <header>
    <h1>Gallery</h1>
    <a class="back-btn" href="/menu">← Back to Menu</a>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Gallery toolbar">
    <div class="toolbar-left">
      <button id="uploadBtn" class="btn" title="Upload files" style="display:none">Upload</button>
    </div>

    <label>
      Sort:
      <select id="sortSelect" aria-label="Sort gallery">
        <option value="nameAsc">Name A→Z</option>
        <option value="nameDesc">Name Z→A</option>
        <option value="typeAsc">Type ↑</option>
        <option value="typeDesc">Type ↓</option>
        <option value="sizeAsc">Size ↑</option>
        <option value="sizeDesc">Size ↓</option>
      </select>
    </label>

    <label>
      Per page:
      <!-- default 20, max 100 -->
      <input id="pageSizeInput" type="number" min="1" max="100" value="20" aria-label="Items per page" style="width:4.5rem" />
    </label>

    <button class="view-btn" data-size="small" title="Small view" aria-label="Small view">🔳</button>
    <button class="view-btn" data-size="medium" title="Medium view" aria-label="Medium view">🔲</button>
    <button class="view-btn active" data-size="large" title="Large view" aria-label="Large view">⬜</button>
  </div>

  <main>
    <div class="grid-wrapper">
      <div id="grid" class="media-grid medium" aria-live="polite"></div>
    </div>

    <div class="pager">
      <button id="prevBtn" class="btn btn-secondary">Prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn" class="btn btn-secondary">Next</button>
    </div>
  </main>

  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal(event)">&times;</button>
      <div id="modalMedia"></div>
      <div id="modalInfo" class="modal-info"></div>
    </div>
  </div>

  <input id="uploadInput" type="file" multiple style="display:none" />

<script>
/* ---------- CONFIG ---------- */
const ROOT = '/Gallery';
const INDEX_ENDPOINT = '/api/index';
const UPLOAD_ENDPOINT = '/upload';
const FALLBACK_INDEX_FILES = ['Gallery.index.ndjson','Gallery.nested.ndjson','index.ndjson','Gallery.index.ndjson.meta'];
const IMAGE_EXTS = ['.jpg','.jpeg','.png','.webp','.avif','.gif'];
const VIDEO_EXTS = ['.mp4','.webm','.ogg','.mov'];
const CACHE_NAME = 'nomad-gallery-thumbs-v1';
const WHITE_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1' height='1'><rect width='100%' height='100%' fill='%23ffffff'/></svg>";

/* ---------- UI refs ---------- */
const grid = document.getElementById('grid');
const uploadBtn = document.getElementById('uploadBtn');
const uploadInput = document.getElementById('uploadInput');
const viewButtons = document.querySelectorAll('.view-btn');
const sortSelect = document.getElementById('sortSelect');
const pageSizeInput = document.getElementById('pageSizeInput');
const modal = document.getElementById('modal');
const modalMedia = document.getElementById('modalMedia');
const modalInfo = document.getElementById('modalInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInfo = document.getElementById('pageInfo');

/* ---------- STATE ---------- */
let items = [];
let filtered = [];
let currentSize = localStorage.getItem('nomadGallery.viewSize') || 'medium';

// clamp page size between 1 and 100, default 20
function clampPageSize(v){ const n = parseInt(v||0,10)||20; return Math.min(100, Math.max(1, n)); }
let pageSize = clampPageSize(localStorage.getItem('nomadGallery.pageSize') || pageSizeInput.value || 20);
let currentPage = 1;
let sortMode = localStorage.getItem('nomadGallery.sort') || sortSelect.value;

/* ---------- THUMBNAIL QUEUE & DEDUPE ---------- */
// Images go through this queue too, not just videos. There is no device-side
// thumbnailing, so an image thumb pulls the FULL original off the SD card. A
// gallery of a few hundred photos firing those in parallel outruns the
// firmware's 8 concurrent streams and its ~60KB of internal heap: responses get
// truncated mid-body (NS_ERROR_NET_RESET) and every thumb falls back to the
// white placeholder. Sequential + paced keeps us under that ceiling.
const thumbQueue = [];           // { item, imgEl, spinner, kind }
const thumbPending = new Set();  // dedupe by path
let thumbWorkerRunning = false;

/* ---------- IntersectionObserver: only queue thumbs when card visible ---------- */
const observerOptions = { root: null, rootMargin: '400px 0px', threshold: 0.05 };
const cardObserver = new IntersectionObserver((entries) => {
  for(const e of entries){
    if(e.isIntersecting){
      const card = e.target;
      const jobData = card._thumbJob; // set in createCard for image + video cards
      if(jobData){
        enqueueThumbJob(jobData.item, jobData.imgEl, jobData.spinner, jobData.kind);
        // after queued, stop observing
        cardObserver.unobserve(card);
      }
    }
  }
}, observerOptions);

/* ---------- Cache helpers ---------- */
function thumbCacheKey(item){
  const v = item.mt || item.sz || item.size || 0;
  return `${location.origin}/__thumbcache__/${encodeURIComponent(item.path)}?v=${encodeURIComponent(v)}`;
}
async function getCachedThumb(item){
  try{
    const cache = await caches.open(CACHE_NAME);
    const match = await cache.match(new Request(thumbCacheKey(item)));
    if(match){
      const blob = await match.blob();
      const url = URL.createObjectURL(blob);
      return { blob, url };
    }
  }catch(e){}
  return null;
}
async function storeThumbToCache(item, blob, mime='image/jpeg'){
  try{
    const cache = await caches.open(CACHE_NAME);
    const key = new Request(thumbCacheKey(item));
    const resp = new Response(blob, { headers: { 'Content-Type': mime }});
    await cache.put(key, resp);
    return true;
  }catch(e){
    return false;
  }
}

/* ---------- Queue processor (sequential) ---------- */
function enqueueThumbJob(item, imgEl, spinner, kind='video'){
  if(thumbPending.has(item.path)) return;
  thumbPending.add(item.path);
  thumbQueue.push({ item, imgEl, spinner, kind });
  processThumbQueue().catch(()=>{/* ignore */});
}

async function processThumbQueue(){
  if(thumbWorkerRunning) return;
  thumbWorkerRunning = true;
  while(thumbQueue.length){
    const job = thumbQueue.shift();
    const { item, imgEl, spinner, kind } = job;
    if(!document.body.contains(imgEl)){ thumbPending.delete(item.path); continue; }
    spinner.style.display = 'flex';

    try{
      // cached?
      const cached = await getCachedThumb(item);
      if(cached){
        setImageFromBlobUrl(imgEl, cached.url);
        spinner.style.display = 'none';
        thumbPending.delete(item.path);
        await new Promise(r => setTimeout(r, 60));
        continue;
      }

      if(kind === 'image'){
        // one full-size original at a time. no direct-URL fallback on failure:
        // that would re-request the same bytes off-queue and undo the pacing.
        const r = await fetch(fileUrlWithVersion(item.path,item), { cache:'no-store', credentials:'same-origin' });
        if(r.ok){
          const b = await r.blob();
          await storeThumbToCache(item, b, b.type || 'image/jpeg');
          setImageFromBlobUrl(imgEl, URL.createObjectURL(b));
        } else {
          imgEl.src = WHITE_SVG;
        }
      } else {
        // range-first strategy: try to fetch a partial chunk and extract a frame from ~3s into the video
        const videoUrl = mediaStreamUrlWithVersion(item.path, item);
        const dataUrl = await rangeFetchAndExtract(videoUrl, 3.0, 450000).catch(()=>null);

        if(dataUrl){
          const blob = dataURLToBlob(dataUrl);
          await storeThumbToCache(item, blob, 'image/jpeg');
          const blobUrl = URL.createObjectURL(blob);
          setImageFromBlobUrl(imgEl, blobUrl);
        } else {
          // fallback white placeholder
          imgEl.src = WHITE_SVG;
        }
      }
    }catch(e){
      imgEl.src = WHITE_SVG;
    }finally{
      spinner.style.display = 'none';
      thumbPending.delete(item.path);
      await new Promise(r => setTimeout(r, 80));
    }
  }
  thumbWorkerRunning = false;
}

/* ---------- small helper to set <img> from blobURL safely ---------- */
function setImageFromBlobUrl(imgEl, blobUrl){
  const old = imgEl.dataset.objectUrl;
  if(old && old !== blobUrl){
    try{ URL.revokeObjectURL(old); }catch(e){}
  }
  imgEl.dataset.objectUrl = blobUrl;
  imgEl.onload = () => {
    imgEl.style.opacity = '1';
  };
  imgEl.src = blobUrl;
  imgEl.onerror = () => { imgEl.src = WHITE_SVG; };
}

/* ---------- range-first fetch + extraction ---------- */
async function rangeFetchAndExtract(videoUrl, seekTime = 3.0, rangeBytes = 450000){
  try{
    const headers = { 'Range': `bytes=0-${rangeBytes}` };
    const res = await fetch(videoUrl, { method: 'GET', headers, cache: 'no-store', credentials: 'same-origin' });
    if(!res.ok) return null;
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    try{
      const dataUrl = await extractFrameFromVideo(blobUrl, seekTime, 3500);
      URL.revokeObjectURL(blobUrl);
      return dataUrl;
    }catch(err){
      URL.revokeObjectURL(blobUrl);
      return null;
    }
  }catch(e){
    return null;
  }
}

/* ---------- extract a frame from a video sourceUrl (blob or remote) ---------- */
function extractFrameFromVideo(sourceUrl, seekTime = 3.0, timeoutMs = 3000){
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    let settled = false;
    function cleanup(){ if(settled) return; settled = true; try{ video.pause(); video.removeAttribute('src'); video.load(); }catch(e){} }

    video.crossOrigin = 'anonymous';
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;
    video.src = sourceUrl;

    const onLoaded = () => {
      const dur = isFinite(video.duration) && video.duration > 0 ? video.duration : seekTime;
      const seekTarget = dur < 1 ? Math.max(0.01, dur / 2) : Math.min(seekTime, Math.max(0.05, Math.min(dur - 0.05, seekTime)));
      let didSeek = false;
      const onSeeked = () => {
        if(didSeek) return;
        didSeek = true;
        try{
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 320;
          canvas.height = video.videoHeight || 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const data = canvas.toDataURL('image/jpeg', 0.85);
          cleanup();
          resolve(data);
        }catch(err){
          cleanup();
          reject(err);
        }
      };
      video.currentTime = seekTarget;
      video.addEventListener('seeked', onSeeked, { once: true });
      setTimeout(()=>{ if(!didSeek){ cleanup(); reject(new Error('seek timeout')); } }, timeoutMs);
    };

    const onError = () => { cleanup(); reject(new Error('video load error')); };

    video.addEventListener('loadedmetadata', onLoaded, { once: true });
    video.addEventListener('error', onError, { once: true });
  });
}

/* ---------- small helpers ---------- */
function dataURLToBlob(dataURL){
  const parts = dataURL.split(',');
  const meta = parts[0];
  const base64 = parts[1] || '';
  const mimeMatch = meta.match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(base64);
  const len = binary.length;
  const u8 = new Uint8Array(len);
  for(let i=0;i<len;i++) u8[i] = binary.charCodeAt(i);
  return new Blob([u8], { type: mime });
}

function joinPaths(a,b){ if(!a) return normalizePath(b||''); if(!b) return normalizePath(a||''); return normalizePath(a + '/' + b); }
function encodePathSegments(path){ if(!path) return ''; let p=String(path).replace(/\\/g,'/').replace(/\/+/g,'/'); const leading=p.startsWith('/')? '/' : ''; return leading + p.split('/').filter(Boolean).map(s=>encodeURIComponent(s)).join('/'); }
function fileUrlDirect(path){ return encodePathSegments(path); }
function mediaStreamUrl(path){ return '/media?file=' + encodeURIComponent(path); }
function extFromName(name){ const i = name.lastIndexOf('.'); return i>=0? name.slice(i).toLowerCase() : ''; }
function basename(path){ if(!path) return ''; const idx = path.lastIndexOf('/'); return idx>=0? path.slice(idx+1):path; }
function isImageName(n){ return IMAGE_EXTS.includes(extFromName(n)); }
function isVideoName(n){ return VIDEO_EXTS.includes(extFromName(n)); }
function prettify(name){ if(!name) return ''; let n = name.replace(/\.[^/.]+$/,''); let t = n.replace(/[_\.]+/g,' ').trim(); t = t.replace(/\s*\(?\d{4}\)?\s*$/,'').trim(); return t || name; }
function formatBytes(bytes){ if(!bytes && bytes !== 0) return '0 B'; const k=1024,s=['B','KB','MB','GB','TB']; const i=Math.floor(Math.log(Math.max(bytes,1))/Math.log(k)); return parseFloat((bytes/Math.pow(k,i)).toFixed(1)) + ' ' + s[i]; }
function fileUrlWithVersion(path,item){ const ver = item && (item.mt||item.sz||item.size) ? (item.mt||item.sz||item.size) : Date.now(); const base = fileUrlDirect(path); return base + (base.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(ver); }
function mediaStreamUrlWithVersion(path,item){ const ver = item && (item.mt||item.sz||item.size) ? (item.mt||item.sz||item.size) : Date.now(); const base = mediaStreamUrl(path); return base + (base.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(ver); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- NDJSON parsing & index fetch ---------- */
function parseNDJSONWithHeader(text){
  const lines = text.split('\n').filter(Boolean);
  if(lines.length === 0) return { header: null, entries: [] };
  let header = null;
  const entries = [];
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    try{
      const parsed = JSON.parse(line);
      if(i===0 && parsed && (parsed._type || parsed.count !== undefined || parsed.path)) { header = parsed; continue; }
      entries.push(parsed);
    }catch(e){
      const brace = line.indexOf('{');
      if(brace >= 0){
        try{ const parsed = JSON.parse(line.slice(brace)); entries.push(parsed); continue; }catch(e2){}
      }
    }
  }
  return { header, entries };
}

async function fetchRawNDJSONFile(urlPath){
  const url = urlPath + '?_=' + Date.now();
  const res = await fetch(url, { cache:'no-store', credentials:'same-origin' });
  if(!res.ok) throw new Error('fetch failed ' + res.status);
  const text = await res.text();
  return parseNDJSONWithHeader(text);
}

/* This page never asks for a reindex on its own.
   While a reindex runs the firmware sets indexingTasksActive and returns 503 for every
   media request device-wide, so triggering one from a page load can stall playback
   everywhere. An empty or unsigned index is nearly always just an empty folder.
   Reindex lives on the admin page. A 202 is different, the firmware is already
   building, so polling for it is fine as long as it stops. */
const MAX_BUILD_POLLS = 10;   // ~30s of 202 polling, then stop
let buildPolls = 0;

function showGalleryMessage(msg){
  grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">${msg}</p>`;
}

async function fetchIndexWithFallback(path){
  try{
    const apiUrl = `${INDEX_ENDPOINT}?path=${encodeURIComponent(normalizePath(path))}&_=${Date.now()}`;
    let res = await fetch(apiUrl, { cache:'no-store', credentials:'same-origin' });
    // 503 means the SD is busy for a moment, retry before falling back
    for(let i=0; i<3 && res.status===503; i++){
      await new Promise(r=>setTimeout(r, 800*(i+1)));
      res = await fetch(apiUrl, { cache:'no-store', credentials:'same-origin' });
    }
    if(res.ok){
      const text = await res.text();
      const parsed = parseNDJSONWithHeader(text);

      // check for a valid header signature. a missing sig can also mean the response was
      // truncated in transit under load, so only act on it if we havent already tried once
      if(!parsed.header || !parsed.header.sig){
        // nearly always just an empty folder, so take the answer and move on. asking for a
        // rebuild here put that load on the device from every phone for nothing
        console.warn('No index signature found in gallery, treating as empty.');
      }

      if(parsed.header && parsed.header.count !== undefined && parsed.entries.length < parsed.header.count){
        // partial -> fallback
      } else if(parsed.entries.length > 0){
        return { source: 'api', header: parsed.header, entries: parsed.entries };
      }
    } else if(res.status === 202) {
      // Server is building the index on its own. Poll, but bounded: an unbounded
      // 3s poll never stops if the build keeps failing.
      if(buildPolls < MAX_BUILD_POLLS){
        buildPolls++;
        console.log(`Gallery index is building (202) - poll ${buildPolls}/${MAX_BUILD_POLLS}`);
        showGalleryMessage('Building gallery index... Please wait.');
        setTimeout(async () => {
          try {
            await refreshIndex();
            renderPage();
          } catch(e) {
            console.error('Retry after 202 failed', e);
            showGalleryMessage('Could not load gallery.');
          }
        }, 3000);
      } else {
        console.warn('Gallery index still building after max polls; giving up.');
        showGalleryMessage('Gallery index is still building. Reload the page in a moment.');
      }
      return { source: null, header: null, entries: [] };
    }
  }catch(e){
    console.error('Gallery index fetch error:', e);
  }

  // Try fallback files
  for(const fname of FALLBACK_INDEX_FILES){
    try{
      const pathAttempt = joinPaths(ROOT, fname);
      const parsed = await fetchRawNDJSONFile(pathAttempt);
      if(parsed.entries && parsed.entries.length > 0){
        return { source: pathAttempt, header: parsed.header, entries: parsed.entries };
      }
    }catch(e){}
  }

  // Nothing in the API or the fallback files. Usually just an empty /Gallery,
  // so say so rather than asking the device to rebuild.
  console.warn('No gallery index found in API or fallback files');
  showGalleryMessage('No photos found. If you just added files, reindex from the admin page.');

  return { source: null, header: null, entries: [] };
}

/* ---------- build gallery ---------- */
async function buildGallery(){
  const map = new Map();
  const resp = await fetchIndexWithFallback(ROOT);
  for(const e of resp.entries){
    const n = e.n || e.name || null;
    const p = e.p || e.path || null;
    let entryPath = null;
    if(p) entryPath = String(p);
    else if(n && String(n).includes('/')) entryPath = String(n);
    else if(n) entryPath = joinPaths(ROOT, n);
    if(entryPath && !entryPath.startsWith('/')) entryPath = joinPaths(ROOT, entryPath);
    if(!entryPath) continue;
    entryPath = normalizePath(entryPath);
    const b = basename(entryPath);
    if(isImageName(b) || isVideoName(b)){
      const type = isVideoName(b) ? 'video' : 'image';
      const item = { name: prettify(b), path: entryPath, type, size: e.sz || e.size || 0, mt: e.mt || 0 };
      map.set(entryPath, item);
    }
  }
  return Array.from(map.values()).sort((a,b)=> a.name.localeCompare(b.name));
}

/* ---------- create card (register observer for videos) ---------- */
function createCard(item){
  const isVideo = item.type === 'video';
  const card = document.createElement('div');
  card.className = 'media-card';
  card.title = item.name;
  card.tabIndex = 0;

  const thumb = document.createElement('img');
  thumb.className = 'media-thumb';
  thumb.alt = item.name;
  thumb.loading = 'lazy';
  thumb.onerror = () => { thumb.src = WHITE_SVG; };

  const spinner = document.createElement('div');
  spinner.className = 'spinner';
  const dot = document.createElement('div'); dot.className = 'dot'; spinner.appendChild(dot);
  spinner.style.display = 'none';

  card.appendChild(thumb);
  card.appendChild(spinner);

  if(isVideo){
    thumb.src = WHITE_SVG;
    const overlay = document.createElement('div');
    overlay.className = 'play-overlay';
    overlay.innerHTML = '▶';
    card.appendChild(overlay);

    // attach job metadata to card and observe it (thumbnail will only be queued when visible)
    card._thumbJob = { item, imgEl: thumb, spinner, kind: 'video' };
    cardObserver.observe(card);
  } else {
    // image: same observer + queue as video. previously this fired its own
    // unthrottled fetch per card at creation time, so a full page of photos hit
    // the server all at once and starved it.
    thumb.src = WHITE_SVG;
    card._thumbJob = { item, imgEl: thumb, spinner, kind: 'image' };
    cardObserver.observe(card);
  }

  card.addEventListener('click', ()=> openModal(item));
  card.addEventListener('keypress', (e)=> { if(e.key === 'Enter') openModal(item); });

  return card;
}

/* ---------- render & pagination ---------- */
// free blob URLs + observers before discarding a card, else every page/sort change leaks thumbnail memory
function destroyCard(card){
  try{ cardObserver.unobserve(card); }catch(e){}
  const thumb = card.querySelector && card.querySelector('.media-thumb');
  const url = thumb && thumb.dataset && thumb.dataset.objectUrl;
  if(url){ try{ URL.revokeObjectURL(url); }catch(e){} }
}
function clearGrid(){
  for(const card of grid.children) destroyCard(card);
  grid.innerHTML = '';
}

function renderPage(){
  // clamp page size between 1 and 100
  pageSize = clampPageSize(parseInt(pageSizeInput.value,10) || pageSize);
  localStorage.setItem('nomadGallery.pageSize', pageSize);
  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;
  const pageItems = filtered.slice(start, end);
  clearGrid();
  if(pageItems.length === 0){
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">No items.</p>`;
    return;
  }
  for(const item of pageItems){
    const c = createCard(item);
    grid.appendChild(c);
  }
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
  prevBtn.disabled = currentPage === 1;
  nextBtn.disabled = currentPage === totalPages;
}

function setViewSize(size){
  currentSize = size;
  viewButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.size === size));
  grid.className = 'media-grid ' + size;
  localStorage.setItem('nomadGallery.viewSize', size);
}
// the click handler is wired once in init(), with the rest of the UI

function applySort(){
  sortMode = sortSelect.value;
  localStorage.setItem('nomadGallery.sort', sortMode);
  filtered = [...items];
  if(sortMode.startsWith('name')) filtered.sort((a,b)=> sortMode === 'nameDesc' ? b.name.localeCompare(a.name) : a.name.localeCompare(b.name));
  else if(sortMode.startsWith('type')) filtered.sort((a,b)=> sortMode === 'typeDesc' ? b.type.localeCompare(a.type) : a.type.localeCompare(b.type));
  else if(sortMode.startsWith('size')) filtered.sort((a,b)=> sortMode === 'sizeDesc' ? (b.size||0)-(a.size||0) : (a.size||0)-(b.size||0));
  currentPage = 1;
  renderPage();
}
function changePage(delta){
  currentPage += delta;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if(currentPage<1) currentPage=1;
  if(currentPage>totalPages) currentPage=totalPages;
  renderPage();
}

/* ---------- modal (zoom/pan + playback) ---------- */
let modalGeneration = 0;
function openModal(item){
  if(modal._cleanup){ modal._cleanup(); modal._cleanup = null; } // in case a modal was already open (e.g. hash navigation)
  modalMedia.innerHTML = '';
  modalInfo.innerHTML = '';
  const gen = ++modalGeneration;
  const modalUrls = []; // blob URLs created for this modal instance, revoked on close
  let mediaEl;
  if(item.type === 'video'){
    mediaEl = document.createElement('video');
    mediaEl.src = mediaStreamUrlWithVersion(item.path,item);
    mediaEl.controls = true; mediaEl.preload = 'metadata'; mediaEl.autoplay = false; mediaEl.setAttribute('playsinline','');
    (async ()=>{
      const cached = await getCachedThumb(item);
      if(!cached) return;
      if(gen !== modalGeneration){ try{ URL.revokeObjectURL(cached.url); }catch(e){} return; }
      mediaEl.poster = cached.url;
      modalUrls.push(cached.url);
    })();
    modalMedia.appendChild(mediaEl);
  } else {
    mediaEl = document.createElement('img');
    (async ()=>{
      const cached = await getCachedThumb(item);
      if(cached && gen !== modalGeneration){ try{ URL.revokeObjectURL(cached.url); }catch(e){} return; }
      if(cached){ mediaEl.src = cached.url; modalUrls.push(cached.url); }
      else mediaEl.src = fileUrlWithVersion(item.path,item);
    })();
    mediaEl.alt = item.name;
    modalMedia.appendChild(mediaEl);
  }

  modalInfo.innerHTML = `<p><strong>Name:</strong> ${escapeHtml(item.name)}</p>
                         <p><strong>Type:</strong> ${escapeHtml(item.type)}</p>
                         <p><strong>Size:</strong> ${formatBytes(item.size)}</p>`;
  modal.style.display = 'flex';

  // Zoom and pan belong to photos. Bound to a video they swallowed every
  // click on the player controls, which is why playback looked broken.
  const zoomable = (item.type !== 'video');
  if (zoomable) {
  mediaEl.style.transformOrigin = 'center center';
  mediaEl.style.cursor = 'zoom-in';
  mediaEl.style.transition = 'none';
  mediaEl.setAttribute('draggable','false');

  let zoom=1, offsetX=0, offsetY=0, dragStartX=0, dragStartY=0, isDragging=false, dragMoved=false;
  function updateTransform(){ mediaEl.style.transform = `scale(${zoom}) translate(${offsetX}px, ${offsetY}px)`; mediaEl.style.cursor = zoom>1 ? (isDragging? 'grabbing' : 'grab') : 'zoom-in'; }

  mediaEl.addEventListener('wheel', (e)=>{ e.preventDefault(); const rect = mediaEl.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top; const oldZoom=zoom; zoom = Math.min(Math.max(1, zoom + Math.sign(e.deltaY)*-0.2),5); const factor = zoom/oldZoom; offsetX -= (mx/oldZoom)*(factor-1); offsetY -= (my/oldZoom)*(factor-1); updateTransform(); });
  mediaEl.addEventListener('click', (e)=>{ if(dragMoved){ dragMoved=false; return; } const rect=mediaEl.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top; if(zoom===1){ const zoomFactor=2, cx=rect.width/2, cy=rect.height/2; zoom=zoomFactor; offsetX=(cx-mx)/zoom; offsetY=(cy-my)/zoom; } else { zoom=1; offsetX=0; offsetY=0; } updateTransform(); });
  mediaEl.addEventListener('mousedown', (e)=>{ if(zoom===1) return; isDragging=true; dragMoved=false; dragStartX=e.clientX; dragStartY=e.clientY; mediaEl.style.cursor='grabbing'; });
  window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
  function onMouseMove(e){ if(!isDragging) return; const dx=(e.clientX-dragStartX)/zoom; const dy=(e.clientY-dragStartY)/zoom; if(Math.abs(dx)>3 || Math.abs(dy)>3) dragMoved=true; offsetX+=dx; offsetY+=dy; dragStartX=e.clientX; dragStartY=e.clientY; updateTransform(); }
  function onMouseUp(){ if(!isDragging) return; isDragging=false; mediaEl.style.cursor='grab'; setTimeout(()=>dragMoved=false,100); }
  }   // end zoomable

  // videos get the same Plyr player the movies page uses
  let plyr = null;
  if (item.type === 'video' && window.Plyr) {
    NomadPlyr.ready().then(() => {
      if (gen !== modalGeneration) return;      // modal already moved on
      try {
        plyr = new Plyr(mediaEl, NomadPlyr.opts({
          controls: ['play-large','play','progress','current-time','duration','mute','volume','fullscreen']
        }));
      } catch(e){ mediaEl.controls = true; }
    });
  }

  modal._cleanup = ()=>{
    if (zoomable) { window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp); }
    if (plyr) { try { plyr.destroy(); } catch(e){} plyr = null; }
    const v = modalMedia.querySelector('video'); if(v){ v.pause(); try{ v.removeAttribute('src'); v.load(); }catch(e){} }
    for(const url of modalUrls){ try{ URL.revokeObjectURL(url); }catch(e){} }
  };
}
function closeModal(evt){
  if(modal._cleanup && evt && evt.type === 'click' && evt.clientX === 0 && evt.clientY === 0) return;
  if(evt.target === modal || (evt.target && evt.target.classList && evt.target.classList.contains('modal-close'))){
    if(modal._cleanup){ modal._cleanup(); modal._cleanup = null; }
    modal.style.display = 'none';
  }
}

/* ---------- upload (shared NomadUpload modal; sends dir=/Gallery) ---------- */
uploadBtn.addEventListener('click', () => uploadInput.click());
uploadInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  uploadInput.value = '';
  if(!files.length) return;
  (async () => {
    uploadBtn.disabled = true;
    const ok = await NomadUpload.run(files, ROOT);
    uploadBtn.disabled = false;
    if(ok) await refreshIndex();
  })();
});
/* admin toggle: the button only appears when uploads are allowed */
NomadUI.config().then(c => { if(!c.uploadsDisabled && uploadBtn) uploadBtn.style.display = ''; });

/* ---------- Hash helpers (open via #open=...) ---------- */
function getHashParam(){
  const h = (location.hash || '').replace(/^#/,'');
  if(!h) return { action:null, path:null };
  const [k, ...rest] = h.split('=');
  const v = rest.join('=');
  try { return { action: k || null, path: v ? decodeURIComponent(v) : null }; } catch(e){ return { action: k || null, path: v || null }; }
}

async function handleHashNavigation(hashObj){
  if(!hashObj || !hashObj.action) return;
  if(hashObj.action === 'open' && hashObj.path){
    const want = normalizePath(hashObj.path);
    if(items.length === 0) await refreshIndex(); // ensure we have items
    // try exact normalized match -> basename match -> endsWith
    let found = items.find(it => normalizePath(it.path) === want);
    if(!found) found = items.find(it => normalizePath('/' + basename(it.path)) === want);
    if(!found){
      const wantBase = want.split('/').pop();
      found = items.find(it => normalizePath(it.path).endsWith(wantBase));
    }
    if(found){
      // try to set currentPage so card is visible
      const idx = filtered.findIndex(it => normalizePath(it.path) === normalizePath(found.path));
      if(idx >= 0){
        currentPage = Math.floor(idx / pageSize) + 1;
        renderPage();
        // allow the rendered card to exist and then open modal (cards create thumbnails async)
        setTimeout(()=> openModal(found), 120);
      } else {
        // not in filtered => open it directly (modal) anyway
        openModal(found);
      }
    } else {
      console.warn('gallery item not found for hash', want);
    }
  }
}
window.addEventListener('hashchange', ()=> handleHashNavigation(getHashParam()));

/* ---------- index & boot ---------- */
async function refreshIndex(){
  items = await buildGallery();
  filtered = items.slice();
  applySort();
}

async function init(){
  try{
    // UI wiring
    setViewSize(currentSize);
    pageSizeInput.value = pageSize;
    sortSelect.value = sortMode;
    pageSizeInput.addEventListener('change', ()=> { pageSize = clampPageSize(pageSizeInput.value); localStorage.setItem('nomadGallery.pageSize', pageSize); currentPage=1; renderPage(); });
    sortSelect.addEventListener('change', ()=> applySort());
    prevBtn.addEventListener('click', ()=> changePage(-1));
    nextBtn.addEventListener('click', ()=> changePage(1));
    viewButtons.forEach(btn => btn.addEventListener('click', ()=> setViewSize(btn.dataset.size)));

    items = await buildGallery();
    filtered = items.slice();
    applySort();

    // handle initial hash if present (open requested item)
    await handleHashNavigation(getHashParam());
  }catch(e){ console.error('init error', e); }
}
document.addEventListener('keydown', (e)=> { if(e.key === 'Escape'){ if(modal.style.display === 'flex') closeModal({ target: modal }); } });
init();
</script>

<script>
/* Khan-Nomad gallery: upload pill icon, lightbox close/prev/next/counter, arrow keys and
   swipe between photos, pager hidden on a single page, toolbar pinned under the header.
   Hooks the functions above instead of rewriting them. */
(function(){
  const svg = (paths, size) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="pointer-events:none">' + paths + '</svg>';
  const ICON_UPLOAD = '<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>';
  const ICON_CLOSE  = '<path d="M6 6l12 12M18 6L6 18"/>';
  const ICON_PREV   = '<path d="M15 6l-6 6 6 6"/>';
  const ICON_NEXT   = '<path d="M9 6l6 6-6 6"/>';

  // upload: terracotta pill. the text node stays, so i18n still translates it,
  // and the display:none / uploadsDisabled logic above is untouched
  uploadBtn.classList.add('kn-upload');
  uploadBtn.insertAdjacentHTML('afterbegin', svg(ICON_UPLOAD, 17));

  // sticky toolbar sits exactly under the header, whatever height it ends up
  (function fitToolbar(){
    const tb = document.querySelector('.toolbar');
    const hd = document.querySelector('body > header');
    if(!tb || !hd) return;
    const apply = () => { tb.style.top = hd.offsetHeight + 'px'; };
    apply();
    window.addEventListener('resize', apply);
    window.addEventListener('load', apply);
  })();

  /* ---- lightbox ---- */
  modal.classList.add('kn-lightbox');
  const box = modal.querySelector('.modal-content');
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  const closeBtn = box.querySelector('.modal-close');
  closeBtn.type = 'button';
  closeBtn.innerHTML = svg(ICON_CLOSE, 22);   // svg ignores pointer events, so closeModal still sees the button as target
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.title = 'Close';

  function navButton(cls, label, icon){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'kn-nav ' + cls;
    b.setAttribute('aria-label', label);
    b.title = label;
    b.hidden = true;
    b.innerHTML = svg(icon, 24);
    box.appendChild(b);
    return b;
  }
  const prevPhoto = navButton('kn-prev', 'Previous', ICON_PREV);
  const nextPhoto = navButton('kn-next', 'Next', ICON_NEXT);
  const counter = document.createElement('div');
  counter.className = 'kn-count';
  counter.setAttribute('data-no-i18n', '');
  box.appendChild(counter);

  let current = null;   // the item the lightbox shows
  const isOpen = () => modal.style.display === 'flex';
  const position = () => current ? filtered.indexOf(current) : -1;

  function updateNav(){
    const i = position(), n = filtered.length;
    const show = i >= 0 && n > 1;
    prevPhoto.hidden = nextPhoto.hidden = !show;
    prevPhoto.disabled = i <= 0;
    nextPhoto.disabled = i < 0 || i >= n - 1;
    counter.textContent = show ? (i + 1) + ' / ' + n : '';
  }
  function step(delta){
    const j = position() + delta;
    if(position() < 0 || j < 0 || j >= filtered.length) return;
    openModal(filtered[j]);
  }
  prevPhoto.addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
  nextPhoto.addEventListener('click', (e) => { e.stopPropagation(); step(1); });

  const _openModal = openModal;
  openModal = function(item){
    current = item;
    const out = _openModal.apply(this, arguments);
    try { updateNav(); document.documentElement.classList.add('kn-lb-open'); } catch(e){}
    return out;
  };
  const _closeModal = closeModal;
  closeModal = function(evt){
    const out = _closeModal.apply(this, arguments);
    if(!isOpen()){ current = null; document.documentElement.classList.remove('kn-lb-open'); }
    return out;
  };

  // arrow keys flip photos; leave them alone while the video player or a field has focus
  document.addEventListener('keydown', (e) => {
    if(!isOpen() || e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target;
    if(t && t.closest && t.closest('.plyr, video, input, select, textarea')) return;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
  });

  // swipe left/right on a photo (not on videos: that would fight the seek bar, nor while zoomed in)
  let sx = 0, sy = 0, st = 0, tracking = false;
  modalMedia.addEventListener('touchstart', (e) => {
    tracking = false;
    if(e.touches.length !== 1 || !current || current.type === 'video') return;
    const img = modalMedia.querySelector('img');
    const tf = img ? (img.style.transform || '') : '';
    if(tf && !/^scale\(1\)/.test(tf)) return;   // zoomed: the drag pans instead
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); tracking = true;
  }, { passive: true });
  modalMedia.addEventListener('touchend', (e) => {
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(Date.now() - st < 700 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---- pager: hide it when everything fits on one page ---- */
  const pager = document.querySelector('.pager');
  const _renderPage = renderPage;
  renderPage = function(){
    const out = _renderPage.apply(this, arguments);
    try {
      pager.hidden = Math.ceil(filtered.length / pageSize) <= 1;
      if(isOpen()) updateNav();
    } catch(e){}
    return out;
  };
})();
</script>
</body>
</html>
