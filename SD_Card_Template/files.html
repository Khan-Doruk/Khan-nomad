<!DOCTYPE html>
<!-- Nomad Files Page -->
<!-- Version 4 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Khan-Nomad Media Server – Files" />
  <title>Nomad • Files</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/master.css" />
  <script src="/theme-boot.js"></script>
  <script src="/nomad-utils.js?v=45"></script>
  <script src="/theme-manager.js"></script>
  <style>
    /* Functional CSS: Full-height layout and sticky positioning */
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 0.5rem;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      margin-left: -0.5rem;
      margin-right: -0.5rem;
      padding-left: calc(1rem + 0.5rem);
      padding-right: calc(1rem + 0.5rem);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .toolbar {
      padding: 0.75rem 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 56px;
      z-index: 45;
      justify-content: flex-end;
      margin-left: -0.5rem;
      margin-right: -0.5rem;
      padding-left: calc(1rem + 0.5rem);
      padding-right: calc(1rem + 0.5rem);
      background: var(--bg);
    }
    .toolbar input[type="search"] {
      flex: 1 1 200px;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 0.9rem;
      min-width: 0;
    }
    body.dark .toolbar input[type="search"] { background: var(--card); color: var(--text); }

    .toolbar .btn {
      padding: .5rem .9rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: var(--radius);
      font-size: .9rem;
      cursor: pointer;
    }
    .toolbar select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 0.9rem;
      min-width: 120px;
    }

    main {
      flex: 1;
      padding: 1rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    ul.file-list { list-style: none; padding: 0; margin: 0; }
    ul.file-list li {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      word-break: break-word;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.3s forwards;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    ul.file-list li a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
      display: inline-block;
    }
    .file-info {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 110px;
      text-align: right;
    }

    @media (max-width: 600px) {
      body { padding: 0 0.25rem; }
      header { padding-left: calc(1rem + 0.25rem); padding-right: calc(1rem + 0.25rem); margin-left: -0.25rem; margin-right: -0.25rem; }
      .toolbar { flex-direction: column; align-items: stretch; justify-content: center; padding-left: calc(1rem + 0.25rem); padding-right: calc(1rem + 0.25rem); margin-left: -0.25rem; margin-right: -0.25rem; }
      .toolbar input[type="search"], .toolbar select { flex: none; width: 100%; min-width: auto; }
      main { padding: 0.75rem 0.5rem; width: 100%; }
      ul.file-list li { flex-direction: column; align-items: flex-start; gap: 0.5rem; padding: 0.5rem 0.75rem; }
      ul.file-list li a { max-width: 100%; white-space: normal; word-break: break-word; }
      .file-info { white-space: normal; width: 100%; text-align: left; min-width: auto; }
    }
    body.dark .back-btn { background: rgba(255,255,255,0.12); color: var(--header-text); }
  </style>
<link rel="stylesheet" href="/khan-pages.css">
<style id="khan-page">
  /* ---- Khan-Nomad files: pill toolbar, rows with a round type chip ---- */
  .toolbar{gap:8px;top:var(--header-height);border-bottom:1px solid var(--kn-line);justify-content:flex-start}
  .toolbar select{height:38px;padding:0 .9rem;min-width:0;background:var(--card-bg);font-weight:600;cursor:pointer}
  .toolbar input[type="search"]{height:38px}
  .toolbar select:focus-visible, .toolbar input[type="search"]:focus-visible{outline:2px solid var(--kn-terracotta);outline-offset:2px}
  /* upload: terracotta pill (still hidden until NomadUI says uploads are allowed) */
  .toolbar #uploadBtn.kn-upload{order:5;height:38px;min-height:0;padding:0 16px 0 12px;gap:6px;border-radius:999px;border:1px solid var(--kn-terracotta);background:var(--kn-terracotta);color:#fff;font-size:.88rem;font-weight:700;box-shadow:none;display:inline-flex;align-items:center}
  .toolbar #uploadBtn.kn-upload:hover:not(:disabled){filter:brightness(.95);transform:none;box-shadow:none}
  .toolbar #uploadBtn.kn-upload:focus-visible{outline:2px solid var(--kn-terracotta);outline-offset:2px}
  body.dark .toolbar #uploadBtn.kn-upload{color:#24140C}
  @media (max-width:600px){
    /* search on its own row, filter, sort and upload share the next one */
    .toolbar{flex-direction:row;flex-wrap:wrap;align-items:center}
    .toolbar input[type="search"]{flex:1 1 100% !important;width:auto}
    .toolbar select{flex:1 1 0;width:auto;min-width:0}
    .toolbar #uploadBtn.kn-upload{flex:none}
  }

  main{padding:14px 12px 28px}
  ul.file-list li, body.dark ul.file-list li{position:relative;margin-bottom:8px;padding:10px 14px 10px 10px;gap:12px;background:var(--card-bg);border:1px solid var(--kn-line);border-radius:14px;box-shadow:none;justify-content:flex-start;transition:border-color .15s ease, background-color .15s ease}
  ul.file-list li.kn-file{flex-direction:row;align-items:center}
  ul.file-list li.kn-file:hover{border-color:var(--kn-terracotta)}
  ul.file-list li.kn-file:focus-within{box-shadow:0 0 0 2px var(--kn-terracotta)}
  ul.file-list li.kn-file a{outline:none}
  /* the name link covers the whole row, so a tap anywhere downloads */
  ul.file-list li.kn-file a::after{content:"";position:absolute;inset:0;border-radius:14px}
  /* loading, empty and error lines: plain muted text, no card */
  ul.file-list li:not(.kn-file), body.dark ul.file-list li:not(.kn-file){background:transparent;border:0;justify-content:center;text-align:center;color:var(--muted);padding:40px 16px}

  .kn-ico{flex:none;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--kn-sand);color:#8A6A3A}
  .kn-ico[data-kind="media"]{background:var(--kn-terracotta-soft);color:var(--kn-terracotta)}
  .kn-ico[data-kind="doc"]{background:var(--kn-teal-soft);color:var(--kn-teal)}
  body.dark .kn-ico{color:var(--kn-cream)}
  body.dark .kn-ico[data-kind="media"]{color:var(--kn-terracotta)}
  .kn-file-text{flex:1;min-width:0}
  ul.file-list li.kn-file .kn-file-text a{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:none;white-space:normal;overflow:hidden;overflow-wrap:anywhere;word-break:normal;color:var(--text);font-weight:600;font-size:.95rem;line-height:1.3}
  ul.file-list li.kn-file .file-info{min-width:0;width:auto;margin-top:2px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;color:var(--muted)}
  .kn-dl{flex:none;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--kn-line);color:var(--muted);transition:color .15s ease, border-color .15s ease}
  ul.file-list li.kn-file:hover .kn-dl{color:var(--kn-terracotta);border-color:var(--kn-terracotta)}
  @media (prefers-reduced-motion: reduce){
    ul.file-list li{animation:none;opacity:1;transform:none;transition:none}
  }
</style>
<script src="/i18n.js"></script>
</head>
<body data-page="files">
  <header>
    <h1>Files</h1>
    <a class="back-btn" href="/menu">← Back to Menu</a>
  </header>

  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="Search files…" aria-label="Search files" />
    <select id="typeFilter" aria-label="Filter by type">
      <option value="all">All</option>
      <option value="pdf">PDF</option>
      <option value="txt">TXT</option>
      <option value="zip">ZIP</option>
      <option value="mp3">MP3</option>
      <option value="mp4">MP4</option>
      <option value="html">HTML</option>
      <option value="stl">STL</option>
      <option value="png">PNG</option>
      <option value="jpg">JPG</option>
      <option value="exe">EXE</option>
      <option value="docx">DOCX</option>
      <option value="xlsx">XLSX</option>
      <option value="pptx">PPTX</option>
    </select>
    <button id="uploadBtn" class="btn" style="display:none">Upload</button>
    <input id="uploadInput" type="file" multiple style="display:none">
    <select id="sortSelect" aria-label="Sort files">
      <option value="nameAsc">Name A→Z</option>
      <option value="nameDesc">Name Z→A</option>
      <option value="sizeAsc">Size ↑</option>
      <option value="sizeDesc">Size ↓</option>
      <option value="typeAsc">Type ↑</option>
      <option value="typeDesc">Type ↓</option>
    </select>
  </div>

  <main>
    <ul id="fileList" class="file-list"></ul>
  </main>

<script>
    /* Config */
    const ROOT_PATH = '/Files';
    const INDEX_ENDPOINT = '/api/index';
    // /media is the firmware's byte-range file endpoint; the old /download
    // route never existed on this firmware, every link fell to the portal
    const DOWNLOAD_ENDPOINT = '/media';

    function fileUrl(path) {
      return `${DOWNLOAD_ENDPOINT}?file=${encodeURIComponent(path)}`;
    }
    /* State */
    const files = [];
    let filtered = [];

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }


    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function extFromName(name) {
      const i = (name || '').lastIndexOf('.');
      return i > 0 ? name.slice(i + 1).toLowerCase() : '';
    }

    async function fetchIndex(path) {
      const INDEX_ENDPOINT = '/api/index';
      const url = `${INDEX_ENDPOINT}?path=${encodeURIComponent(normalizePath(path))}&_=${Date.now()}`;
      // a busy card answers 503 for a moment right after boot; retry like the
      // other library pages instead of showing an error
      let res = await fetch(url, { cache: 'no-store' });
      for (let i = 0; i < 3 && res.status === 503; i++) {
        await new Promise(r => setTimeout(r, 700 * (i + 1)));
        res = await fetch(url, { cache: 'no-store' });
      }

      if (res.status === 202) {
        throw new Error('INDEX_BUILDING');
      }

      if (!res.ok) throw new Error('index fetch failed ' + res.status);
      const text = await res.text();
      const lines = text.split('\n').filter(Boolean);
      const header = lines.length ? JSON.parse(lines[0]) : null;
      const entries = [];
      for (let i = 1; i < lines.length; i++) {
        try { entries.push(JSON.parse(lines[i])); } catch (e) { }
      }
      return { header, entries };
    }

    async function init() {
      try {
        const fileListEl = document.getElementById('fileList');
        fileListEl.innerHTML = '<li>Loading files...</li>';

        const resp = await fetchIndex('/Files');
        if (resp.entries && resp.entries.length > 0) {
          files.length = 0;
          files.push(...resp.entries
            .filter(Boolean)
            .filter(obj => obj.t === 'f')
            .map(obj => {
              const path = obj.n && obj.n.startsWith('/Files/') ? obj.n : `/Files/${(obj.n || '').replace(/^\/+/, '')}`;
              const ext = extFromName(obj.n || '');
              return {
                name: obj.n || path.split('/').pop(),
                path: path,
                type: ext,
                size: obj.sz || 0
              };
            })
          );
        } else {
          // media.json is only a bucket-count summary on this firmware, so
          // there is no fallback list to read - an empty index is the answer
          fileListEl.innerHTML = '<li>No files found. The index may be building.</li>';
          return;
        }

        applyFilters();
      } catch (e) {
        if (e.message === 'INDEX_BUILDING') {
          document.getElementById('fileList').innerHTML = '<li>Index is building, please wait...</li>';
          setTimeout(init, 5000);
        } else {
          console.error('Error loading files:', e);
          document.getElementById('fileList').innerHTML = '<li>Error loading files.</li>';
        }
      }
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const typeFilter = document.getElementById('typeFilter').value;
      const sortBy = document.getElementById('sortSelect').value;

      filtered = files.filter(file => {
        const matchesSearch = file.name.toLowerCase().includes(search);
        const matchesType = typeFilter === 'all' || file.type === typeFilter;
        return matchesSearch && matchesType;
      });

      filtered.sort((a, b) => {
        switch (sortBy) {
          case 'nameAsc': return a.name.localeCompare(b.name);
          case 'nameDesc': return b.name.localeCompare(a.name);
          case 'sizeAsc': return a.size - b.size;
          case 'sizeDesc': return b.size - a.size;
          case 'typeAsc': return a.type.localeCompare(b.type);
          case 'typeDesc': return b.type.localeCompare(a.type);
          default: return 0;
        }
      });

      renderFiles();
    }

    function renderFiles() {
      const fileListEl = document.getElementById('fileList');
      if (filtered.length === 0) {
        fileListEl.innerHTML = '<li>No files match your criteria.</li>';
        return;
      }

      fileListEl.innerHTML = filtered.map(file => `
        <li>
          <a href="${fileUrl(file.path)}" download="${escapeHtml(file.name)}">${escapeHtml(file.name)}</a>
          <div class="file-info">${formatBytes(file.size)} • ${escapeHtml(file.type.toUpperCase())}</div>
        </li>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {

      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('typeFilter').addEventListener('change', applyFilters);
      document.getElementById('sortSelect').addEventListener('change', applyFilters);

      init();
    });

/* ---------- upload (shared NomadUpload modal; sends dir=/Files) ---------- */
const uploadBtn = document.getElementById('uploadBtn');
const uploadInput = document.getElementById('uploadInput');
uploadBtn.addEventListener('click', () => uploadInput.click());
uploadInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  uploadInput.value = '';
  if(!files.length) return;
  (async () => {
    uploadBtn.disabled = true;
    const ok = await NomadUpload.run(files, '/Files');
    uploadBtn.disabled = false;
    if(ok) await init();
  })();
});
/* admin toggle: the button only appears when uploads are allowed */
NomadUI.config().then(c => { if(!c.uploadsDisabled) uploadBtn.style.display = ''; });
</script>

<script>
/* Khan-Nomad files page: each row gets a round type chip (terracotta video/audio, teal
   documents, sand archives and the rest), the name over a muted "size • TYPE" line, and
   a download mark. Hooks renderFiles instead of rewriting it. */
(function(){
  const svg = (paths, size) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + paths + '</svg>';
  const ICONS = {
    video:   '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z"/>',
    audio:   '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    doc:     '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
    archive: '<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/>',
    image:   '<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/>',
    file:    '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'
  };
  const ICON_DL = '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>';
  const VIDEO = /^(mp4|mkv|avi|mov|webm|m4v|mpg|mpeg|ts|m2ts|wmv|flv|3gp)$/;
  const AUDIO = /^(mp3|flac|wav|m4a|m4b|aac|ogg|oga|opus|wma|aiff?)$/;
  const DOC   = /^(pdf|txt|md|rtf|doc|docx|odt|xls|xlsx|ods|csv|ppt|pptx|odp|epub|mobi|azw3|cbz|cbr|html?|json|xml)$/;
  const ARCH  = /^(zip|7z|rar|tar|gz|tgz|bz2|xz|iso|dmg|exe|msi|apk|deb|bin|img)$/;
  const IMAGE = /^(jpe?g|png|gif|webp|avif|bmp|svg|heic|tiff?)$/;

  function kindOf(ext){
    ext = String(ext || '').toLowerCase();
    if (VIDEO.test(ext)) return { kind: 'media', icon: 'video' };
    if (AUDIO.test(ext)) return { kind: 'media', icon: 'audio' };
    if (DOC.test(ext))   return { kind: 'doc',   icon: 'doc' };
    if (ARCH.test(ext))  return { kind: 'other', icon: 'archive' };
    if (IMAGE.test(ext)) return { kind: 'other', icon: 'image' };
    return { kind: 'other', icon: 'file' };
  }

  function decorate(){
    const list = document.getElementById('fileList');
    if (!list) return;
    list.querySelectorAll(':scope > li').forEach(li => {
      const a = li.querySelector(':scope > a');
      if (!a || li.classList.contains('kn-file')) return;   // loading / empty lines stay plain
      const name = a.getAttribute('download') || a.textContent || '';
      const k = kindOf(extFromName(name));
      li.classList.add('kn-file');

      const chip = document.createElement('span');
      chip.className = 'kn-ico';
      chip.dataset.kind = k.kind;
      chip.setAttribute('aria-hidden', 'true');
      chip.innerHTML = svg(ICONS[k.icon], 20);

      const text = document.createElement('div');
      text.className = 'kn-file-text';
      a.setAttribute('data-no-i18n', '');   // file names are not interface text
      const info = li.querySelector(':scope > .file-info');
      li.insertBefore(chip, a);
      li.insertBefore(text, a);
      text.appendChild(a);
      if (info) text.appendChild(info);

      const dl = document.createElement('span');
      dl.className = 'kn-dl';
      dl.setAttribute('aria-hidden', 'true');
      dl.innerHTML = svg(ICON_DL, 17);
      li.appendChild(dl);
    });
  }

  const _renderFiles = renderFiles;
  renderFiles = function(){
    const out = _renderFiles.apply(this, arguments);
    try { decorate(); } catch (e) { console.warn('[khan] file rows decorate failed', e); }
    return out;
  };

  // upload: terracotta pill with an icon; the text node stays for i18n
  const up = document.getElementById('uploadBtn');
  if (up) {
    up.classList.add('kn-upload');
    up.insertAdjacentHTML('afterbegin', svg('<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>', 17).replace('stroke-width="1.9"', 'stroke-width="2.2"'));
  }

  // sticky toolbar sits exactly under the header, whatever height it ends up
  const tb = document.querySelector('.toolbar');
  const hd = document.querySelector('body > header');
  if (tb && hd) {
    const apply = () => { tb.style.top = hd.offsetHeight + 'px'; };
    apply();
    window.addEventListener('resize', apply);
    window.addEventListener('load', apply);
  }

  // in case the list was already drawn before this script ran
  try { decorate(); } catch (e) {}
})();
</script>
</body>
</html>
