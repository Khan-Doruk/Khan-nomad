<style>
  /* Functional CSS: Movies-specific layout and Plyr.js customization */
  :root{
    --card-gap:1rem; /* used in JS for calculations */
    --header-height:68px; /* fallback used by CSS; JS will set exact top */
  }

  body{display:flex;flex-direction:column;min-height:100vh}

  /* Dark mode overrides */
  body.dark .toolbar{ background: var(--bg); border-bottom-color: var(--white-alpha-4); }

  header{
    position:sticky;
    top:0;
    z-index:60;
    -webkit-box-align:center;
  }

  .toolbar{
    background:var(--bg);
    padding:.65rem 1rem;
    display:flex;
    flex-wrap:wrap;
    gap:.6rem;
    align-items:center;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:var(--header-height);
    z-index:55;
  }
  .toolbar input[type="search"]{flex:1 1 220px;padding:.5rem .75rem;border:1px solid var(--line);border-radius:var(--radius);font-size:0.95rem;background:var(--card);color:var(--text)}
  .toolbar select, .toolbar .view-btn{padding:.48rem .7rem;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--radius);font-size:0.9rem;cursor:pointer}
  .view-btn.active{background:var(--primary);color:var(--color-white);border-color:var(--primary-dark);}

  main{flex:1;display:flex;flex-direction:column;max-width:1200px;width:100%;margin:0 auto;padding:1rem}
  .grid-wrapper{flex:1;overflow-y:auto;padding-bottom:12px}
  .media-grid{display:grid;gap:var(--card-gap);}

  .media-grid.small  {grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
  .media-grid.medium {grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .media-grid.large  {grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}

  /* card specifics */
  .media-card{width:100%;max-width:220px;margin:0 auto;will-change:transform,opacity;}
  .media-grid.small  .media-card{max-width:120px;}
  .media-grid.medium .media-card{max-width:160px;}
  .media-grid.large  .media-card{max-width:220px;}

  @media (max-width:600px){
    .toolbar{top:112px;}
    .media-grid.small  {grid-template-columns:repeat(2,1fr);}
    .media-grid.medium {grid-template-columns:repeat(3,1fr);}
    .media-grid.large  {grid-template-columns:repeat(4,1fr);}
  }

  .thumb-wrapper{position:relative;display:flex;align-items:center;justify-content:center;background:var(--thumb-bg);color:var(--thumb-text);font-size:0.9rem;text-align:center;width:100%;aspect-ratio:2/3;}
  .fallback-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;text-align:center;font-weight:700;color:var(--thumb-title);pointer-events:none;padding:6px}
  .media-thumb{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:1;opacity:0;transition:opacity .35s ease;}
  .badge-resume{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(0,0,0,0.6);color:#fff;padding:6px 10px;border-radius:999px;font-weight:700;font-size:12px;z-index:4;display:block;min-width:40px;max-width:85%;overflow:hidden}

  .meta{padding:10px 8px;text-align:center}
  .meta .title{font-weight:700;color:var(--thumb-title);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:0.95rem}
  .meta .dir{font-size:12px;color:var(--text-gray);overflow:hidden;white-space:nowrap;text-overflow:ellipsis; display:none}

  /* Plyr.js player customization */
  .plyr {
    --plyr-color-main: var(--primary);
    --plyr-video-controls-background: var(--overlay-video);
    border-radius: var(--radius);
    width: 100%;
  }
  .plyr__video-wrapper { width: 100%; }
  .plyr--fullscreen { background: var(--color-black); }
  .plyr--fullscreen video {
    max-height: 100% !important;
    max-width: 100% !important;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  @media (max-width: 768px) {
    .plyr__volume { display: none !important; }
  }
  body.dark .plyr {
    --plyr-video-background: var(--color-black);
    --plyr-menu-background: var(--overlay-menu);
    --plyr-menu-color: var(--color-white);
  }

  /* modal specifics */
  .modal,.video-modal{display:none;position:fixed;inset:0;background:var(--overlay-modal);justify-content:center;align-items:center;z-index:1000;padding:20px;}
  .modal-content {
    background: var(--card-bg);
    color: var(--text);
    padding:20px;
    border-radius:var(--radius);
    text-align:center;
    width:94%;
    max-width:480px;
    box-shadow:var(--shadow-large);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .modal-content h2 {margin:0;font-size:1.15rem;font-weight:700;}
  #modalSub {font-size:0.9rem;color:var(--muted)}

  .modal button {
    padding:10px 14px;
    font-size:0.95rem;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background-color .18s ease, color .18s ease;
  }
  .modal button { width:100%; font-weight:600; }
  .modal button:not(.cancel):not(.secondary) {
    background:var(--primary);
    color:var(--color-white);
  }
  /* resume = outlined accent, download/cancel = outlined muted. tokens flip for dark on their own */
  .modal button.secondary { background:transparent; color:var(--primary); border:1px solid var(--primary); }
  .modal button.cancel { background:transparent; color:var(--text); border:1px solid var(--line); }

  .video-modal-content {
    background: var(--card-bg);
    color: var(--text);
    padding:14px;
    border-radius:var(--radius);
    width:100%;
    max-width:980px;
    box-shadow:var(--shadow-large);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .video-modal-content h2 { color:var(--text); font-size:1.05rem; margin:0; text-align:center; font-weight:700 }
  .video-container { width:100%; display:flex;flex-direction:column;align-items:center;gap:8px; }
  .video-container video { width:100%; border-radius:var(--radius); }
  .video-modal-content .close-btn {
    padding:10px 14px;
    font-size:0.95rem;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    background:var(--primary);
    color:var(--color-white);
    transition:filter .18s ease;
  }
  .video-modal-content .close-btn:hover { filter:brightness(0.96); }

  /* entrance animation for cards */
  .media-card.play-anim { animation-name:cardIn; animation-duration:360ms; animation-timing-function:cubic-bezier(.2,.9,.2,1); animation-fill-mode:both; will-change:transform,opacity; }
  @keyframes cardIn {
    from { opacity:0; transform:translateX(-18px) scale(.994); }
    to   { opacity:1; transform:translateX(0) scale(1); }
  }

  /* dark mode modal adjustments */
  body.dark .modal { background: var(--overlay-modal); }
  body.dark .modal-content {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--white-alpha-3);
  }
  /* modal button colors come from the theme tokens above, no dark overrides needed */
  body.dark .video-modal { background: rgba(0,0,0,0.88); }
  body.dark .video-modal-content {
    background: #071018;
    border: 1px solid rgba(255,255,255,0.03);
  }
  body.dark .video-container video {
    background: #000;
    outline: 1px solid rgba(255,255,255,0.03);
  }
  body.dark .video-modal-content .close-btn { background: var(--white-alpha-12); color: var(--color-white); }
  body.dark .back-btn { background: var(--white-alpha-12); color: var(--color-white); }
  body.dark .view-btn.active { border-color: var(--primary); }
</style>

<style id="khan-page">
  /* ---- Khan-Nomad movies: poster grid ---- */
  main{padding:14px 16px 24px}
  .media-grid{gap:18px 12px}
  @media (max-width:600px){
    main{padding:12px 12px 24px}
    .media-grid{gap:14px 10px}
    /* compact = more posters per row, gallery = fewer (3 per row is the default) */
    .media-grid.small  {grid-template-columns:repeat(4,minmax(0,1fr));}
    .media-grid.medium {grid-template-columns:repeat(3,minmax(0,1fr));}
    .media-grid.large  {grid-template-columns:repeat(2,minmax(0,1fr));}
    .media-grid .media-card{max-width:none}
  }
  .media-card{background:transparent !important;box-shadow:none !important;border-radius:0;overflow:visible;outline:none}
  .media-card:hover{transform:none;box-shadow:none !important}
  .media-grid .media-card .thumb-wrapper{border-radius:10px;overflow:hidden;background:var(--kn-sand);transition:transform .2s ease, box-shadow .2s ease}
  @media (hover:hover){
    .media-card:hover .thumb-wrapper{transform:translateY(-3px);box-shadow:0 8px 18px rgba(27,58,75,.18)}
  }
  .media-card:active .thumb-wrapper{transform:scale(.98)}
  .media-card:focus-visible .thumb-wrapper{box-shadow:0 0 0 3px var(--kn-terracotta)}
  .media-card .fallback-text{color:var(--text);font-family:var(--kn-serif);font-weight:600;font-size:.85rem;line-height:1.25;padding:8px}
  .media-card .badge-resume{display:none !important}
  .kn-title{margin-top:7px;padding:0 2px;font-size:.8rem;font-weight:600;line-height:1.25;color:var(--text);text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .media-grid.small .kn-title{font-size:.72rem}
  .media-grid.large .kn-title{font-size:.9rem}
  /* watched fraction along the poster's bottom edge */
  .kn-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.35);z-index:5;pointer-events:none}
  .kn-progress i{display:block;height:100%;background:var(--kn-terracotta)}
  /* first seen on this device in the last 3 days */
  .kn-new{position:absolute;top:6px;left:6px;z-index:5;background:var(--kn-terracotta);color:#fff;font-size:10px;font-weight:700;line-height:1;padding:4px 7px;border-radius:999px;letter-spacing:.02em;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  body.dark .kn-new{color:#24140C}

  /* ---- action modal as a bottom sheet ---- */
  #modal.kn-sheet{align-items:flex-end;justify-content:center;padding:0;background:rgba(15,34,48,.48);animation:knFade .2s ease both}
  #modal.kn-sheet > .modal-content{position:relative;width:100%;max-width:520px;margin:0 auto;border:0;border-radius:18px 18px 0 0;padding:6px 18px calc(14px + env(safe-area-inset-bottom, 0px));text-align:left;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:88vh;overflow:auto;background:var(--card-bg);color:var(--text);animation:knSheetUp .28s cubic-bezier(.2,.9,.2,1) both}
  #modal .kn-handle{display:block;width:64px;height:20px;margin:0 auto -4px;padding:0;border:0;background:transparent;cursor:pointer;flex:none}
  #modal .kn-handle::before{content:"";display:block;width:36px;height:4px;margin:0 auto;border-radius:2px;background:var(--kn-line)}
  #modal .kn-vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .kn-sheet-head{display:flex;gap:14px;align-items:center}
  .kn-sheet-thumb{flex:none;width:64px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--kn-sand);color:var(--muted);display:flex;align-items:center;justify-content:center}
  .kn-sheet-thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .kn-sheet-info{flex:1;min-width:0}
  #modalSub.kn-sheet-title{font-family:var(--kn-serif);font-size:1.2rem;font-weight:600;line-height:1.25;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .kn-sheet-meta{margin-top:5px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 0}
  .kn-sheet-meta span + span::before{content:"\00B7";margin:0 6px;color:var(--muted);font-weight:400}
  .kn-sheet-meta .kn-left{color:var(--kn-terracotta);font-weight:600}
  #modal .kn-actions{display:flex;gap:10px;align-items:stretch}
  #modal .kn-actions button{flex:1 1 0;width:auto;min-width:0;min-height:46px;margin:0;padding:10px 12px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:filter .15s ease, background-color .15s ease}
  #modal .kn-actions .kn-primary{background:var(--kn-terracotta);color:#fff;border:1px solid var(--kn-terracotta)}
  body.dark #modal .kn-actions .kn-primary{color:#24140C}
  #modal .kn-actions .kn-outline{background:transparent;color:var(--text);border:1.5px solid var(--kn-line)}
  #modal .kn-actions .kn-icon{flex:0 0 46px;width:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--text);border:1.5px solid var(--kn-line)}
  #modal .kn-actions button:hover{filter:brightness(.95)}
  #modal .kn-actions button:focus-visible, #modal .kn-cancel:focus-visible, #modal .kn-handle:focus-visible{outline:2px solid var(--kn-terracotta);outline-offset:2px}
  #modal .kn-cancel{width:100%;margin:-4px 0 0;padding:8px;border:0;background:transparent;color:var(--muted);font-size:.9rem;font-weight:600;cursor:pointer}
  /* details from <movie>.info.json: genres, clamped description, source credit */
  #modal .kn-about{display:flex;flex-direction:column;gap:8px;margin-top:-2px}
  #modal .kn-about[hidden], #modal .kn-about [hidden]{display:none !important}
  .kn-genres{display:flex;flex-wrap:wrap;gap:6px}
  .kn-genres:empty{display:none}
  .kn-genres span{font-size:.72rem;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;border:1px solid var(--kn-line);color:var(--muted);white-space:nowrap}
  .kn-desc{margin:0;font-size:.9rem;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .kn-desc.kn-open{display:block;-webkit-line-clamp:unset;overflow:visible}
  .kn-desc:empty{display:none}
  .kn-desc-foot{display:flex;align-items:center;gap:10px}
  #modal .kn-more{width:auto;margin:0;padding:2px 0;border:0;background:transparent;color:var(--kn-terracotta);font-size:.85rem;font-weight:700;cursor:pointer;border-radius:4px}
  #modal .kn-more:focus-visible{outline:2px solid var(--kn-terracotta);outline-offset:2px}
  .kn-src{margin-left:auto;font-size:.72rem;color:var(--muted)}
  @keyframes knSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes knFade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    #modal.kn-sheet, #modal.kn-sheet > .modal-content{animation:none}
    .media-card .thumb-wrapper{transition:none}
    .media-card:hover .thumb-wrapper, .media-card:active .thumb-wrapper{transform:none}
  }
</style>

<body data-page="movies">
  <header>
    <h1>Movies</h1>
    <a class="back-btn" href="/menu">← Back to Menu</a>
  </header>

  <div class="toolbar" role="region" aria-label="toolbar">
    <input id="searchInput" type="search" placeholder="Search movies…" aria-label="Search movies">
    <select id="sortSelect" aria-label="Sort movies">
      <option value="nameAsc">A → Z</option>
      <option value="nameDesc">Z → A</option>
    </select>
    <button class="view-btn" data-size="small" title="Compact view" aria-pressed="false">🔳</button>
    <button class="view-btn active" data-size="medium" title="Comfort view" aria-pressed="true">🔲</button>
    <button class="view-btn" data-size="large" title="Gallery view" aria-pressed="false">⬜</button>
  </div>

  <main>
    <div class="grid-wrapper">
      <div id="grid" class="media-grid medium" aria-live="polite" aria-label="Movie list"></div>
    </div>
  </main>

  <div id="modal" class="modal kn-sheet" onclick="if(event.target===this) closeModal();">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalSub" onclick="event.stopPropagation()">
      <button type="button" class="kn-handle" aria-label="Close" onclick="closeModal()"></button>
      <h2 id="modalTitle" class="kn-vh">What would you like to do?</h2>
      <div class="kn-sheet-head">
        <div id="knSheetThumb" class="kn-sheet-thumb" aria-hidden="true"></div>
        <div class="kn-sheet-info">
          <div id="modalSub" class="kn-sheet-title" data-no-i18n></div>
          <div id="knSheetMeta" class="kn-sheet-meta"></div>
        </div>
      </div>
      <div id="knSheetAbout" class="kn-about" hidden>
        <div id="knSheetGenres" class="kn-genres" data-no-i18n></div>

          <button type="button" id="knSheetMore" class="kn-more" aria-expanded="false" aria-controls="knSheetDesc" hidden>More</button>

        </div>

        <button id="resumeButton" class="kn-primary" style="display:none">Resume</button>
        <button id="playButton" class="kn-primary">Play</button>
        <button id="downloadButton" class="kn-icon" data-dl aria-label="Download" title="Download"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      </div>
      <button type="button" onclick="closeModal()" class="kn-cancel">Cancel</button>
    </div>
  </div>

  <div id="videoModal" class="video-modal" onclick="if(event.target===this) closeVideo();">
    <div class="video-modal-content" onclick="event.stopPropagation();">
      <h2 id="videoTitle"></h2>
      <div class="video-container">
        <video id="videoPlayer" controls playsinline aria-label="Video player"></video>
      </div>
      <button id="videoCloseBtn" class="close-btn" onclick="closeVideo()" aria-label="Close video">✕ Close</button>
    </div>

<script>
/* Config */
const ROOT_PATH = '/Movies';
const INDEX_ENDPOINT = '/api/index';
const MEDIA_ENDPOINT = '/media';
const RESUME_KEY = 'nomad:watch:v1';
const ANIM_KEY_BASE = 'nomad:movies:anim:v1';
const VIDEO_EXTS = ['.mp4','.mkv','.avi','.mov','.webm','.m4v'];
const IMAGE_EXTS = ['.jpg','.jpeg','.png','.webp','.avif'];
const SUB_EXTS = ['.srt','.vtt','.ass','.ssa','.sub'];

/* NEW: THEME KEY + THEME BOOT & SYNC */
const THEME_KEY = 'nomad_dark_mode';
function applyThemeFlag(dark){
  if(dark) document.body.classList.add('dark');
  else document.body.classList.remove('dark');

  // Keep search readable: enforce white bg + black text (menu wants this behavior)
  const search = document.querySelector('.search-input');
  if(search){
    try {
      search.style.background = '#fff';
      search.style.color = '#000';
    } catch(e){ /* ignore style errors */ }
  }

  // Resume badges - same style for both themes
  document.querySelectorAll('.badge-resume').forEach(b => {
    b.style.background = 'rgba(0,0,0,0.6)';
    b.style.color = '#fff';
  });
}
(function initThemeFromStorage(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    const isDark = (saved === 'true');
    applyThemeFlag(isDark);
  } catch(e){ applyThemeFlag(false); }
})();

// Keep pages/tabs in sync when menu toggles the key
window.addEventListener('storage', (ev) => {
  if(ev.key === THEME_KEY){
    const dark = ev.newValue === 'true';
    applyThemeFlag(dark);
  }
});
// optional helper for local toggles
function toggleThemeLocal(){
  const isDark = document.body.classList.toggle('dark');
  try { localStorage.setItem(THEME_KEY, isDark ? 'true' : 'false'); }catch(e){}
}

/* State */
let movies = [];      // list of {name, rawName, cover, path, dir, sz, mt, subtitles}
let filtered = [];
let currentSize = localStorage.getItem('nomadMoviesSize') || 'medium';
let currentMovie = null;
let autosaveTimer = null;
let rootSig = null;
// limit for the "index building" retry chain in loadLibrary
let _buildingRetries = 0;
const _MAX_BUILDING_RETRIES = 10;


/* Helpers */
function ext(name){ const i=name.lastIndexOf('.'); return i>=0? name.slice(i).toLowerCase() : ''; }
function isVideoName(n){ return VIDEO_EXTS.includes(ext(n)); }
function isImageName(n){ return IMAGE_EXTS.includes(ext(n)); }
function isSubtitleName(n){ return SUB_EXTS.includes(ext(n)); }
function fileUrl(path){ return `${MEDIA_ENDPOINT}?file=${encodeURIComponent(path)}`; }
function readResume(){ try{ return JSON.parse(localStorage.getItem(RESUME_KEY)||'{}'); }catch(e){return{};} }
function writeResume(v){ localStorage.setItem(RESUME_KEY, JSON.stringify(v)); }
function fileKey(path, sz=0, mt=0){ return `${normalizePath(path)}|${sz||0}|${mt||0}`; }
function formatTime(sec){ if(!sec||!isFinite(sec)) return '0:00'; sec=Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; if(h) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; return `${m}:${String(s).padStart(2,'0')}`; }

/* getHashParam() parses location.hash into {action, path} safely */
function getHashParam(){
  const h = (location.hash || '').replace(/^#/,'');

  if(!h) return { action:null, path:null };
  const [k, ...rest] = h.split('=');
  const v = rest.length ? rest.join('=') : '';
  try {
    return { action: k || null, path: v ? decodeURIComponent(v) : null };
  } catch(e){
    // fallback to raw
    return { action: k || null, path: v || null };
  }
}
/* Better Resume Badge Handling */
function updateResumeBadge(movie, position){
  if(!movie || !movie.path) return;
  const cards = Array.from(gridEl.querySelectorAll('.media-card'));
  for(const card of cards){
    if(card.dataset.path === movie.path){
      const badge = card.querySelector('.badge-resume');
      if(position > 1){
        if(badge){
          badge.textContent = formatTime(position);
          badge.style.background = 'rgba(0,0,0,0.6)';
          badge.style.color = '#fff';
        } else {
          const wrapper = card.querySelector('.thumb-wrapper');
          if(wrapper){
            const div = document.createElement('div');
            div.className = 'badge-resume';
            div.textContent = formatTime(position);
            div.style.background = 'rgba(0,0,0,0.6)';
            div.style.color = '#fff';
            wrapper.appendChild(div);
          }
        }
      } else {
        if(badge) badge.remove();
      }
      break;
    }
  }
}

/* Resume matching */
function findResume(movie){
  const store = readResume();
  const norm = normalizePath(movie.path);
  const exact = fileKey(movie.path, movie.sz||0, movie.mt||0);
  if(store[exact]) return { key: exact, entry: store[exact] };

  for(const k of Object.keys(store)){
    const p = (k.split('|')[0] || '');
    if(normalizePath(p) === norm) return { key:k, entry:store[k] };
  }
  for(const k of Object.keys(store)){
    const p = (k.split('|')[0] || '').replace(/^\//,'');
    if(p === norm.replace(/^\//,'')) return { key:k, entry:store[k] };
  }
  const base = norm.split('/').pop().toLowerCase();
  for(const k of Object.keys(store)){
    const p = (k.split('|')[0] || '').toLowerCase();
    if(p.split('/').pop() === base) return { key:k, entry:store[k] };
  }
  return null;
}
function clearResumeFor(path){
  const store = readResume();
  const norm = normalizePath(path);
  let changed=false;
  for(const k of Object.keys(store)){
    const p = (k.split('|')[0] || '');
    if(normalizePath(p) === norm || p.replace(/^\//,'') === norm.replace(/^\//,'')){
      delete store[k];
      changed = true;
    }
  }
  if(changed) writeResume(store);
}

/* Fetch NDJSON index for a path, cache-busted to avoid stale results */
async function fetchIndex(path){
  const url = `${INDEX_ENDPOINT}?path=${encodeURIComponent(normalizePath(path))}&_=${Date.now()}`;
  let res = await fetch(url, { cache: 'no-store' });

  // 503 means the SD is busy for a moment, not that the index is missing
  for(let i=0; i<3 && res.status===503; i++){
    await new Promise(r=>setTimeout(r, 800*(i+1)));
    res = await fetch(url, { cache: 'no-store' });
  }

  if(res.status === 202) {
    // Server is building index - throw a specific error that can be caught
    throw new Error('INDEX_BUILDING');
  }

  if(!res.ok) throw new Error('index fetch failed '+res.status);
  const text = await res.text();
  const lines = text.split('\n').filter(Boolean);
  const header = lines.length ? JSON.parse(lines[0]) : null;
  const entries = [];
  for(let i=1;i<lines.length;i++){
    try{ entries.push(JSON.parse(lines[i])); }catch(e){}
  }
  return { header, entries };
}


/* Build movies from NDJSON indexes (kept original behavior) */
async function buildFromIndexes(root){
  // Attempt to set rootSig using the root index header
  const rootResp = await fetchIndex(root);
  if(rootResp.header && rootResp.header.sig) rootSig = rootResp.header.sig;

  const map = new Map();
  const seen = new Set();        // full paths already added
  const coveredDirs = new Set(); // folders whose files the root index already listed

  // The bucket index is recursive: a file in /Movies/Classics comes back in the
  // /Movies index with p = "/Movies/Classics/x.mkv". Group every entry by its real
  // folder (from p), not by the folder we asked for, or sub-folder movies show up
  // twice, once with a broken path.
  function addEntry(fallbackDir, e){
    const full = normalizePath(e.p || ((fallbackDir === '/' ? '' : fallbackDir) + '/' + e.n));
    if(seen.has(full)) return;
    seen.add(full);
    const cut = full.lastIndexOf('/');
    const dir = cut > 0 ? full.slice(0, cut) : '/';
    if(e.t !== 'd') coveredDirs.add(dir);
    const base = e.n.replace(/\.[^/.]+$/,'').toLowerCase();
    const key = `${dir}::${base}`;
    if(!map.has(key)) map.set(key, { dir, base, files: [] });
    map.get(key).files.push({ name: e.n, t: e.t, sz: e.sz||0, mt: e.mt||0, full });
  }

  const rootDir = normalizePath(root);
  for(const e of rootResp.entries) addEntry(rootDir, e);

  // Older or partial indexes may not recurse: fetch a child folder's index only
  // when the root index listed nothing inside it (saves a request per folder).
  for(const e of rootResp.entries){
    if(e.t !== 'd') continue;
    const dirPath = normalizePath(e.p || ((root === '/' ? '' : root) + '/' + e.n));
    if(coveredDirs.has(dirPath)) continue;
    try {
      const resp = await fetchIndex(dirPath);
      for(const f of resp.entries) addEntry(dirPath, f);
    } catch(err){
      console.warn('child index missing', dirPath, err);
    }
  }

  // Attach language-suffixed subtitles (Movie.en.srt) to their video's group:
  // the suffix makes their basename differ, so they land in a video-less group
  // of their own and would otherwise be dropped.
  for(const [k,v] of map.entries()){
    if(v.files.some(x => isVideoName(x.name))) continue;
    const subsOnly = v.files.filter(x => isSubtitleName(x.name));
    if(!subsOnly.length) continue;
    let best = null;
    for(const v2 of map.values()){
      if(v2 === v || v2.dir !== v.dir) continue;
      if(!v2.files.some(x => isVideoName(x.name))) continue;
      if(v.base.startsWith(v2.base) && (!best || v2.base.length > best.base.length)) best = v2;
    }
    if(best) best.files.push(...subsOnly);
  }

  const out = [];
  for(const [k,v] of map.entries()){
    const media = v.files.find(x => isVideoName(x.name));
    if(!media) continue;
    const image = v.files.find(x => isImageName(x.name));
    const subs = v.files.filter(x => isSubtitleName(x.name));
    const dir = v.dir;
    // "<base>.info.json" sidecar (year, runtime, description) lands in a group of its own,
    // keyed by "<base>.info". The sheet only fetches it when the index lists it.
    const infoGroup = map.get(`${dir}::${v.base}.info`);
    const infoFile = infoGroup && infoGroup.files.find(x => x.name.toLowerCase() === `${v.base}.info.json`);
    const path = normalizePath((dir === '/' ? '' : dir) + '/' + media.name);
    out.push({
    name: prettify(media.name),
    rawName: media.name,
    cover: image ? (`${MEDIA_ENDPOINT}?file=${encodeURIComponent(normalizePath((dir === '/' ? '' : dir) + '/' + image.name))}&_=${image.mt || image.sz || media.mt || rootSig || Date.now()}`) : null,
    path,
    dir,
    sz: media.sz || 0,
    mt: media.mt || 0,
    subtitles: subs.map(s => ({ path: normalizePath((dir === '/' ? '' : dir) + '/' + s.name), ext: ext(s.name) })),
    info: infoFile ? normalizePath((dir === '/' ? '' : dir) + '/' + infoFile.name) : null,
    infoV: infoFile ? (infoFile.mt || infoFile.sz || 0) : 0
    });
  }
  out.sort((a,b) => a.name.localeCompare(b.name));
  return out;
}
function prettify(filename){
  const n = filename.replace(/\.[^/.]+$/,'');

  let t = n.replace(/[_\.]+/g,' ').trim();
  t = t.replace(/\s*\(?\d{4}\)?\s*$/,'').trim();
  return t || filename;
}

/* Render grid with optional staggered animation on first load */
const gridEl = document.getElementById('grid');

function renderGrid(){
  gridEl.className = `media-grid ${currentSize}`;
  const frag = document.createDocumentFragment();

  for(const item of filtered){
    const card = document.createElement('div');
    card.className = 'media-card';
    // helpful hook to update badge for a specific movie without re-rendering whole grid:
    card.dataset.path = item.path || '';

    const saved = findResume(item);
    const resumeHTML = (saved && saved.entry && saved.entry.position > 1) ? `<div class="badge-resume" style="background:rgba(0,0,0,0.6);color:#fff;">${formatTime(saved.entry.position)}</div>` : '';
    const imgHTML = item.cover ? `<img class="media-thumb" loading="lazy" src="${item.cover}" alt="${escapeHtml(item.name)}">` : '';
    card.innerHTML = `
      <div class="thumb-wrapper">
        <span class="fallback-text">${escapeHtml(item.name)}</span>
        ${resumeHTML}
        ${imgHTML}
      </div>
    `;
    const img = card.querySelector('img');
    const fallback = card.querySelector('.fallback-text');
    if(img){
      img.onload = () => { img.style.opacity = '1'; if(fallback) fallback.style.display = 'none'; };
      img.onerror = () => { img.style.display = 'none'; if(fallback) fallback.style.display = 'block'; };
    } else {
      if(fallback) fallback.style.display = 'block';
    }
    card.addEventListener('click', () => showMovieOptions(item));
    frag.appendChild(card);
  }

  // Clear + append
  gridEl.innerHTML = '';
  gridEl.appendChild(frag);

  // Decide if we should animate now:
  const animKey = rootSig ? `${ANIM_KEY_BASE}:${rootSig}` : ANIM_KEY_BASE;
  const already = localStorage.getItem(animKey);
  if(!already && filtered.length > 0){
    runStaggeredAnimation(animKey);
  }
}

/* Escape helper for injection safety when inserting titles */
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, function(m){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
  });
}

/* Animation logic: compute grid columns and set animationDelay for each card row-by-row left->right */
function runStaggeredAnimation(storeKey){
  const cards = Array.from(gridEl.querySelectorAll('.media-card'));
  if(!cards.length) { localStorage.setItem(storeKey, Date.now()); return; }

  // allow layout to stabilize
  requestAnimationFrame(() => {
    const gridStyles = getComputedStyle(gridEl);
    const gapPx = parseFloat(gridStyles.gap) || 16;
    const gridWidth = Math.max(1, gridEl.clientWidth);
    const firstCardRect = cards[0].getBoundingClientRect();
    const cardWidth = Math.max(1, firstCardRect.width);

    // compute columns (fallback to 1)
    const columns = Math.max(1, Math.floor((gridWidth + gapPx) / (cardWidth + gapPx)));

    const stagger = 45; // ms per step (keeps animation quick)
    cards.forEach((card, i) => {
      const row = Math.floor(i / columns);
      const col = i % columns;
      // Row-by-row left->right: delay increases with (row*columns + col)
      const delay = (row * columns + col) * stagger;
      card.style.animationDelay = `${delay}ms`;
      // apply class to start the animation
      card.classList.add('play-anim');
    });

    // mark as animated so it won't run again until signature changes
    try { localStorage.setItem(storeKey, Date.now()); } catch(e){ /* ignore */ }

    // cleanup inline animationDelay after animation end to keep DOM cleaner
    const maxDelay = (Math.ceil(cards.length / columns) * columns) * stagger + 500;
    setTimeout(() => {
      cards.forEach(c => { c.style.animationDelay = ''; c.classList.remove('play-anim'); /* cards still visible without class */ });
    }, maxDelay);
  });
}

function openMovieFromHash(hashObj){
  if(!hashObj || !hashObj.path) return;
  const wantRaw = hashObj.path || '';
  // getHashParam already decoded this. Decoding twice threw a URIError on
  // names holding a literal % like "50% Off.mp4" and killed the deep link.
  const want = normalizePath(wantRaw);

  // Try to find the movie by exact normalized path, rawName, or basename fallback
  let found = movies.find(m => normalizePath(m.path) === want)
           || movies.find(m => normalizePath('/' + (m.rawName||'')) === want)
           || movies.find(m => normalizePath('/' + (m.rawName||'')).endsWith(want.split('/').pop()))
           || movies.find(m => normalizePath(m.path).endsWith(want.split('/').pop()));

  // If not found, try a quick reload of library once (in case hash arrived before library loaded fully)
  if(!found){
    try {
      // search again, for when hash handling runs early
      found = movies.find(m => normalizePath(m.path) === want) ||
              movies.find(m => normalizePath('/' + (m.rawName||'')) === want) ||
              movies.find(m => normalizePath(m.path).endsWith(want.split('/').pop()));
    } catch(e){
      console.warn('hash reload attempt failed', e);
    }
  }

  if(!found){
    console.warn('movie not found for hash', want);
    return;
  }

  // Set currentMovie used by openVideo / resume logic
  currentMovie = found;

  // Hash navigation indicates intent to play: auto-play with resume
  openVideo(fileUrl(found.path), true);

  // Clear the hash so reloads / back button don't auto-play again unexpectedly
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ /* ignore */ }
}

function handleHashNavigation(hashObj){
  if(!hashObj) return;
  // Accept 'open' or 'play' keys
  if(hashObj.action === 'open' || hashObj.action === 'play' || (!hashObj.action && hashObj.path)){
    openMovieFromHash(hashObj);
  }
}

/* Download helper */
function startDownload(movie){
  if(!confirm(`Download "${movie.name}"?`)) return;
  const a = document.createElement('a');
  // go through /media like playback does. a raw path truncated the request at the
  // first # or ? in a filename, so those downloads 404'd while the file streamed fine
  a.href = `${MEDIA_ENDPOINT}?file=${encodeURIComponent(normalizePath(movie.path))}&download=1`;
  a.download = movie.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

let stallTimer = null, stallRetries = 0;

function startStallWatcher(player, src){
  clearTimeout(stallTimer);
  stallRetries = 0;

  async function probeRange(url){
    try {
      const resp = await fetch(url, {
        method: 'GET',
        headers: { 'Range': 'bytes=0-1023' },
        cache: 'no-store'
      });
      return (resp && (resp.status === 206 || resp.status === 200));
    } catch(e){
      return false;
    }
  }

  async function scheduleCheck(delay = 8000){
    clearTimeout(stallTimer);
    stallTimer = setTimeout(async () => {
      if(player.paused || player.readyState >= 3 || stallRetries >= 2) return;

      const ok = await probeRange(src);
      if(ok){
        scheduleCheck();
        return;
      }

      stallRetries++;
      console.warn('stallWatcher: probe failed, retry attempt', stallRetries);

      const newSrc = `${src}${src.includes('?') ? '&' : '?'}_=${Date.now()}`;
      try {
        player.pause();
        player.src = newSrc;
        try { player.load(); } catch(e){}
        try { player.currentTime = player.currentTime; } catch(e){}
        player.play().catch(()=>{});
      } catch(e){
        console.warn('stallWatcher retry failed', e);
      }

      scheduleCheck(9000);
    }, delay);
  }

  let hasStartedPlaying = false;
  function onFirstPlay(){
    if(hasStartedPlaying) return;
    hasStartedPlaying = true;
    player.removeEventListener('playing', onFirstPlay);
    scheduleCheck();
  }
  player.addEventListener('playing', onFirstPlay);
  player.addEventListener('pause', () => clearTimeout(stallTimer));
  player.addEventListener('ended', () => clearTimeout(stallTimer));
}

      try {
        const vid = window.plyrInstance.media || videoPlayer;
        if(vid.readyState >= 1 && vid.duration > 0){
          seekDone = true;
          vid.currentTime = startTime;
          console.log('Resume position set to:', startTime);
        }
      } catch(e){ console.warn('Seek failed:', e); }
    };
    videoPlayer.addEventListener('canplay', doSeek, { once: true });
    videoPlayer.addEventListener('loadeddata', doSeek, { once: true });
    setTimeout(doSeek, 500);
    setTimeout(doSeek, 1500);
    setTimeout(doSeek, 3000);
  }

  startAutosave();

  const doPlay = () => {
    window.plyrInstance.play().catch(e => console.warn('Play failed:', e));
  };
  if(videoPlayer.readyState >= 3){
    doPlay();
  } else {
    videoPlayer.addEventListener('canplay', doPlay, { once: true });
  }
}
function closeVideo(){
  try{ saveNow(); }catch(e){}
  if (window.plyrInstance) {
    window.plyrInstance.pause();
  }
  videoModal.style.display = 'none';
  stopAutosave();
  releaseWakeLock().catch(()=>{});

  try {
    const allImages = document.querySelectorAll('img[loading="lazy"]');
    allImages.forEach(img => {
      if (img.dataset.originalSrc) {
        img.src = img.dataset.originalSrc;
        delete img.dataset.originalSrc;
      }
    });
    console.log('Resumed lazy image loading');
  } catch(e) {
    console.warn('Could not resume image loading', e);
  }
}

/* autosave every 4s */
function startAutosave(){ stopAutosave(); autosaveTimer = setInterval(saveNow, 4000); }
function stopAutosave(){ if(autosaveTimer){ clearInterval(autosaveTimer); autosaveTimer = null; } }
function saveNow(){
  try {
    if(!currentMovie) return;
    if(!window.plyrInstance) return;
    const cur = Math.floor(window.plyrInstance.currentTime || 0);
    const dur = Math.floor(window.plyrInstance.duration || 0);
    if(!isFinite(cur)) return;
    if(cur > 0 && dur > 0){
      const store = readResume();
      const key = fileKey(currentMovie.path, currentMovie.sz || 0, currentMovie.mt || 0);
      store[key] = { position: cur, duration: dur, updated: Date.now() };
      writeResume(store);
      try { updateResumeBadge(currentMovie, cur); } catch(e){ /* noop */ }
    }
  } catch(e){ console.warn('saveNow failed', e); }
}

/* Fetch & build logic: try indexes then fallback to media.json */
async function loadLibrary(){
  try {
    const list = await buildFromIndexes(ROOT_PATH);
    if(list && list.length){
      movies = list;
      filtered = movies.slice();
      renderGrid();
      return;
    }
  } catch(e){
    if(e && e.message === 'INDEX_BUILDING') {
      // Retry while the index builds, but not forever. A build that never
      // finishes should not leave every phone polling the device.
      if(_buildingRetries < _MAX_BUILDING_RETRIES){
        _buildingRetries++;
        gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Building movie index, please wait...</p>';
        setTimeout(() => loadLibrary(), 3000);
        return;
      }
      gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Index is still building. Refresh to try again.</p>';
      return;
    }
    console.warn('index build failed, falling back', e);
  }

  // media.json is only a bucket-count summary on this firmware (see
  // games.html), so there is no fallback list left to read
  gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Unable to load content.</p>';
}

/* UI: search, sort, size buttons */
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');
const viewButtons = document.querySelectorAll('.view-btn');

function applyFilter(term=''){
  const lower = (term||'').trim().toLowerCase();
  filtered = !lower ? movies.slice() : movies.filter(m => (m.name || '').toLowerCase().includes(lower));
  applySort(sortSelect.value || 'nameAsc');
}
function applySort(mode){
  filtered.sort((a,b) => mode === 'nameDesc' ? b.name.localeCompare(a.name) : a.name.localeCompare(b.name));
  renderGrid();
}
function setViewSize(size){
  currentSize = size;
  viewButtons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.size === size);
    btn.setAttribute('aria-pressed', btn.dataset.size === size ? 'true' : 'false');
  });
  gridEl.className = `media-grid ${size}`;
  localStorage.setItem('nomadMoviesSize', size);
}

/* index poll (cheap) to refresh if index sig changes */
async function checkIndex(){
  // Skip when the tab is hidden or a video is playing. The library cannot
  // change while you are watching, and the poll competes for the SD mutex.
  if(document.hidden) return;
  if(videoModal && videoModal.style.display === 'flex') return;
  try {
    const url = `${INDEX_ENDPOINT}?path=${encodeURIComponent(ROOT_PATH)}&_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) return;
    const text = await res.text();
    const headerLine = text.split('\n')[0];
    if(headerLine){
      const header = JSON.parse(headerLine);
      if(header && header.sig){
        if(!rootSig){
          rootSig = header.sig;
        } else if(rootSig !== header.sig){
          // new signature -> reload library
          rootSig = header.sig;
          await loadLibrary();
        }
      }
    }
  } catch(e){}
}

/* keyboard: allow ESC to close modal/video */
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    if(document.getElementById('videoModal').style.display === 'flex') closeVideo();
    if(document.getElementById('modal').style.display === 'flex') closeModal();
  }
});

/* bootstrap */
setViewSize(currentSize);
viewButtons.forEach(btn => btn.addEventListener('click', () => setViewSize(btn.dataset.size)));
searchInput.addEventListener('input', (e)=> { clearTimeout(window.__debounce); window.__debounce = setTimeout(()=> applyFilter(e.target.value), 150); });
sortSelect.addEventListener('change', ()=> applySort(sortSelect.value));
videoPlayer.addEventListener('ended', closeVideo);

/* NEW: listen for hash changes and route them */
window.addEventListener('hashchange', ()=> handleHashNavigation(getHashParam()));

/* Init sequence */
(async function init(){
  try {
    await loadLibrary();

    function updateToolbarTop(){
      try {
        const headerEl = document.querySelector('header');
        const toolbarEl = document.querySelector('.toolbar');
        if(!headerEl || !toolbarEl) return;
        const h = Math.ceil(headerEl.getBoundingClientRect().height);
        toolbarEl.style.top = h + 'px';
        document.documentElement.style.setProperty('--header-height', h + 'px');
      } catch(e){ /* ignore measurement errors */ }
    }
    window.addEventListener('resize', updateToolbarTop);
    window.addEventListener('load', updateToolbarTop);
    updateToolbarTop();

    try { handleHashNavigation(getHashParam()); } catch(e){ console.warn('hash handling failed', e); }

  } catch(e){
    console.error('init error', e);
  }
  setInterval(checkIndex, 30000);
})();

/* admin toggle: hide the download action when downloads are disabled */
NomadUI.applyDownloadPolicy('downloadButton');
</script>

<script>
/* Khan-Nomad movies page: poster titles, watch progress bars, "New" badges and the
   bottom-sheet action modal. Hooks the functions above instead of rewriting them. */
(function(){
  const NEW_MS = 3 * 24 * 60 * 60 * 1000;   // an item stays "New" for 3 days after first seen
  const SEEN_KEY = 'kn:firstSeen:movies';
  const FILM_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>';
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  /* path -> first-seen timestamp. The very first visit records everything with 0,
     so an existing library does not light up as new. */
  function firstSeenMap(keys){
    let map = null;
    try { map = JSON.parse(localStorage.getItem(SEEN_KEY) || 'null'); } catch(e){ map = null; }
    const fresh = !map || typeof map !== 'object' || Array.isArray(map);
    if(fresh) map = {};
    if(!keys.length) return map;           // nothing loaded yet, do not lock in an empty map
    const now = Date.now();
    let changed = fresh;
    for(const k of keys){
      if(k && !has(map, k)){ map[k] = fresh ? 0 : now; changed = true; }
    }
    if(changed){ try { localStorage.setItem(SEEN_KEY, JSON.stringify(map)); } catch(e){} }
    return map;
  }
  function isNew(ts){ return typeof ts === 'number' && ts > 0 && (Date.now() - ts) < NEW_MS; }

  function watchInfo(movie){
    const r = movie ? findResume(movie) : null;
    const e = r && r.entry;
    if(!e) return null;
    const pos = Number(e.position) || 0, dur = Number(e.duration) || 0;
    return { pos, dur, frac: (pos > 1 && dur > 0) ? Math.min(1, pos / dur) : 0 };
  }

  function setBar(thumb, frac){
    if(!thumb) return;
    let bar = thumb.querySelector('.kn-progress');
    if(!(frac > 0)){ if(bar) bar.remove(); return; }
    if(!bar){
      bar = document.createElement('div');
      bar.className = 'kn-progress';
      bar.setAttribute('aria-hidden', 'true');
      bar.appendChild(document.createElement('i'));
      thumb.appendChild(bar);
    }
    bar.firstChild.style.width = Math.max(3, Math.round(frac * 100)) + '%';
  }

  function decorateGrid(){
    const seen = firstSeenMap((movies || []).map(m => m.path));
    const byPath = new Map();
    (filtered || []).forEach(m => byPath.set(m.path || '', m));
    gridEl.querySelectorAll('.media-card').forEach(card => {
      const m = byPath.get(card.dataset.path || '');
      const thumb = card.querySelector('.thumb-wrapper');
      if(!m || !thumb) return;
      thumb.querySelectorAll('.badge-resume').forEach(b => b.remove());
      if(isNew(seen[m.path]) && !thumb.querySelector('.kn-new')){
        const b = document.createElement('span');
        b.className = 'kn-new';
        b.textContent = 'New';
        thumb.appendChild(b);
      }
      const w = watchInfo(m);
      setBar(thumb, w ? w.frac : 0);
      if(!card.querySelector('.kn-title')){
        const t = document.createElement('div');
        t.className = 'kn-title';
        t.setAttribute('data-no-i18n', '');
        t.textContent = m.name || m.rawName || '';
        card.appendChild(t);
      }
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
    });
  }

  // grid: decorate after every render
  const _renderGrid = renderGrid;
  renderGrid = function(){
    const out = _renderGrid.apply(this, arguments);
    try { decorateGrid(); } catch(e){ console.warn('[khan] grid decorate failed', e); }
    return out;
  };

  // the old time badge becomes the progress bar (called by saveNow while playing)
  updateResumeBadge = function(movie){
    try {
      if(!movie || !movie.path) return;
      const card = Array.from(gridEl.querySelectorAll('.media-card')).find(c => c.dataset.path === movie.path);
      if(!card) return;
      const w = watchInfo(movie);
      setBar(card.querySelector('.thumb-wrapper'), w ? w.frac : 0);
    } catch(e){}
  };

  // posters are focusable, Enter or Space opens the sheet
  gridEl.addEventListener('keydown', (e) => {
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('media-card')){
      e.preventDefault();
      e.target.click();
    }
  });

  /* ---- bottom sheet ---- */
  const thumbBox = document.getElementById('knSheetThumb');
  const metaBox = document.getElementById('knSheetMeta');

  function fmtSize(bytes){
    const gb = bytes / 1073741824;
    if(gb >= 1) return (gb >= 10 ? Math.round(gb) : gb.toFixed(1)) + ' GB';
    return Math.max(1, Math.round(bytes / 1048576)) + ' MB';
  }

  function fillSheet(movie){
    thumbBox.innerHTML = '';
    if(movie.cover){
      const img = document.createElement('img');
      img.alt = '';
      img.onerror = () => { thumbBox.innerHTML = FILM_SVG; };
      img.src = movie.cover;
      thumbBox.appendChild(img);
    } else {
      thumbBox.innerHTML = FILM_SVG;
    }

    const w = watchInfo(movie);
    const canResume = !!(w && w.pos > 1);   // same rule showMovieOptions uses for #resumeButton
    fillMeta(movie, w, null);
    fillAbout(null);

    if(canResume){
      resumeButton.textContent = 'Resume';
      resumeButton.className = 'kn-primary';
      playButton.textContent = 'From start';
      playButton.className = 'kn-outline';
    } else {
      playButton.textContent = 'Play';
      playButton.className = 'kn-primary';
    }
  }

  // year · runtime · size · N min left. The sidecar's runtime wins over the
  // duration remembered from watching (that one only exists after a first play).
  function fillMeta(movie, w, info){
    metaBox.innerHTML = '';
    const add = (txt, cls) => {
      const s = document.createElement('span');
      if(cls) s.className = cls;
      s.textContent = txt;
      metaBox.appendChild(s);
    };
    if(info && info.year) add(String(info.year));
    if(info && info.runtime) add(info.runtime + ' min');
    else if(w && w.dur > 0) add(Math.max(1, Math.round(w.dur / 60)) + ' min');
    if(movie.sz > 0) add(fmtSize(movie.sz));
    if(w && w.pos > 1 && w.dur > w.pos) add(Math.max(1, Math.round((w.dur - w.pos) / 60)) + ' min left', 'kn-left');
  }

  /* ---- <movie>.info.json sidecars (written by tools/movie-info) ---- */
  const aboutBox = document.getElementById('knSheetAbout');
  const genresBox = document.getElementById('knSheetGenres');
  const descBox = document.getElementById('knSheetDesc');
  const moreBtn = document.getElementById('knSheetMore');
  const srcBox = document.getElementById('knSheetSrc');
  const footBox = document.getElementById('knSheetFoot');
  const infoCache = new Map();   // "path|version" -> Promise<info|null>, one fetch per sidecar per page load

  const str = (v, max) => (typeof v === 'string' && v.trim()) ? v.trim().slice(0, max) : '';
  function cleanInfo(d){
    if(!d || typeof d !== 'object' || Array.isArray(d)) return null;
    const year = Math.round(Number(d.year));
    const runtime = Math.round(Number(d.runtime));
    return {
      title: str(d.title, 200),
      year: (year >= 1870 && year <= 2200) ? year : 0,
      runtime: (runtime > 0 && runtime < 6000) ? runtime : 0,
      genres: Array.isArray(d.genres) ? d.genres.map(g => str(g, 40)).filter(Boolean).slice(0, 6) : [],
      description: str(d.description, 3000),
      source: str(d.source, 60)
    };
  }
  function loadInfo(movie){
    if(!movie || !movie.info) return Promise.resolve(null);
    const key = movie.info + '|' + (movie.infoV || 0);
    if(infoCache.has(key)) return infoCache.get(key);
    const p = fetch(`${fileUrl(movie.info)}&_=${movie.infoV || 0}`)
      .then(r => {
        if(r.status === 404) return null;          // gone since the index was built: no info
        if(!r.ok) throw new Error('info ' + r.status);
        return r.json().then(cleanInfo, () => null);   // broken JSON: treat as no info
      })
      .catch(err => { infoCache.delete(key); console.warn('[khan] movie info', err); return null; });
    infoCache.set(key, p);
    return p;
  }

  function setOpen(open){
    descBox.classList.toggle('kn-open', open);
    moreBtn.textContent = open ? 'Less' : 'More';
    moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  moreBtn.addEventListener('click', () => setOpen(!descBox.classList.contains('kn-open')));

  function fillAbout(info){
    genresBox.innerHTML = '';
    descBox.textContent = '';
    srcBox.textContent = '';
    moreBtn.hidden = true;
    setOpen(false);
    const has = info && (info.genres.length || info.description);
    aboutBox.hidden = !has;
    if(!has) return;
    info.genres.forEach(g => {
      const s = document.createElement('span');
      s.textContent = g;
      genresBox.appendChild(s);
    });
    descBox.textContent = info.description;
    srcBox.textContent = info.description ? info.source : '';
    footBox.hidden = !srcBox.textContent;
    // only offer "More" when the 3-line clamp actually cuts something off
    if(info.description){
      requestAnimationFrame(() => {
        if(descBox.scrollHeight > descBox.clientHeight + 2){ moreBtn.hidden = false; footBox.hidden = false; }
      });
    }
  }

  function applyInfo(movie, info){
    if(!info || currentMovie !== movie || modal.style.display !== 'flex') return;
    if(info.title) modalSub.textContent = info.title;
    fillMeta(movie, watchInfo(movie), info);
    fillAbout(info);
  }

  const _showMovieOptions = showMovieOptions;
  showMovieOptions = function(movie){
    const out = _showMovieOptions.apply(this, arguments);
    try { fillSheet(movie); } catch(e){ console.warn('[khan] sheet fill failed', e); }
    if(movie && movie.info) loadInfo(movie).then(info => { try { applyInfo(movie, info); } catch(e){} });
    return out;
  };

  // in case the grid was already drawn before this script ran
  try { if(gridEl.querySelector('.media-card')) decorateGrid(); } catch(e){}
})();
</script>
