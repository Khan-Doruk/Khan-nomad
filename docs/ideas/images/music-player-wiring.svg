<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>Bluetooth music player wiring diagram</title>
<desc>A LiPo battery feeds a TP4056 charger, then a power switch, then an MT3608 boost converter set to 5 volts, which powers the ESP32 5V pin. An OLED screen connects to 3V3, GND, GPIO21 and GPIO22. A battery voltage divider connects to GPIO34. Five buttons connect to GPIO32, 33, 25, 26 and 27, with their other legs to ground.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#888780;stroke-width:0.8}
.amber rect{fill:#FAEEDA;stroke:#BA7517;stroke-width:0.8}
.amber .th{fill:#633806}
.amber .ts{fill:#854F0B}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}
.purple .th{fill:#3C3489}
.purple .ts{fill:#3C3489}
.wire{stroke:#5F5E5A;stroke-width:1.2}
.flow{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="520" rx="12" fill="#FFFFFF"/>
<g class="amber"><rect x="40" y="40" width="120" height="56" rx="8"/><text class="th" x="100" y="58" text-anchor="middle" dominant-baseline="central">LiPo battery</text><text class="ts" x="100" y="78" text-anchor="middle" dominant-baseline="central">3.7V 2000mAh</text></g>
<g class="amber"><rect x="190" y="40" width="130" height="56" rx="8"/><text class="th" x="255" y="58" text-anchor="middle" dominant-baseline="central">TP4056</text><text class="ts" x="255" y="78" text-anchor="middle" dominant-baseline="central">USB-C charger</text></g>
<g class="amber"><rect x="350" y="40" width="100" height="56" rx="8"/><text class="th" x="400" y="58" text-anchor="middle" dominant-baseline="central">Switch</text><text class="ts" x="400" y="78" text-anchor="middle" dominant-baseline="central">On / off</text></g>
<g class="amber"><rect x="480" y="40" width="160" height="56" rx="8"/><text class="th" x="560" y="58" text-anchor="middle" dominant-baseline="central">Boost converter</text><text class="ts" x="560" y="78" text-anchor="middle" dominant-baseline="central">MT3608 set to 5.0V</text></g>
<line x1="160" y1="68" x2="188" y2="68" class="flow" marker-end="url(#arrow)"/>
<line x1="320" y1="68" x2="348" y2="68" class="flow" marker-end="url(#arrow)"/>
<line x1="450" y1="68" x2="478" y2="68" class="flow" marker-end="url(#arrow)"/>
<path d="M560 96 L560 140 L200 140 L200 230 L228 230" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowA)"/>
<text class="ts" x="380" y="128" text-anchor="middle" dominant-baseline="central">5V out to ESP32 5V pin</text>
<g class="purple"><rect x="230" y="170" width="220" height="300" rx="8"/><text class="th" x="340" y="192" text-anchor="middle" dominant-baseline="central">ESP32-WROOM-32</text>
<text class="ts" x="242" y="230" dominant-baseline="central">5V</text>
<text class="ts" x="242" y="260" dominant-baseline="central">3V3</text>
<text class="ts" x="242" y="290" dominant-baseline="central">GND</text>
<text class="ts" x="242" y="320" dominant-baseline="central">GPIO21 SDA</text>
<text class="ts" x="242" y="350" dominant-baseline="central">GPIO22 SCL</text>
<text class="ts" x="242" y="410" dominant-baseline="central">GPIO34</text>
<text class="ts" x="438" y="250" text-anchor="end" dominant-baseline="central">GPIO32</text>
<text class="ts" x="438" y="290" text-anchor="end" dominant-baseline="central">GPIO33</text>
<text class="ts" x="438" y="330" text-anchor="end" dominant-baseline="central">GPIO25</text>
<text class="ts" x="438" y="370" text-anchor="end" dominant-baseline="central">GPIO26</text>
<text class="ts" x="438" y="410" text-anchor="end" dominant-baseline="central">GPIO27</text></g>
<rect class="box" x="40" y="200" width="130" height="165" rx="8"/>
<text class="th" x="105" y="218" text-anchor="middle" dominant-baseline="central">OLED screen</text>
<text class="ts" x="105" y="236" text-anchor="middle" dominant-baseline="central">SSD1306 I2C</text>
<text class="ts" x="158" y="260" text-anchor="end" dominant-baseline="central">VCC</text>
<text class="ts" x="158" y="290" text-anchor="end" dominant-baseline="central">GND</text>
<text class="ts" x="158" y="320" text-anchor="end" dominant-baseline="central">SDA</text>
<text class="ts" x="158" y="350" text-anchor="end" dominant-baseline="central">SCL</text>
<line x1="170" y1="260" x2="230" y2="260" class="wire"/>
<line x1="170" y1="290" x2="230" y2="290" class="wire"/>
<line x1="170" y1="320" x2="230" y2="320" class="wire"/>
<line x1="170" y1="350" x2="230" y2="350" class="wire"/>
<rect class="box" x="40" y="382" width="130" height="56" rx="8"/>
<text class="th" x="105" y="400" text-anchor="middle" dominant-baseline="central">Battery sense</text>
<text class="ts" x="105" y="420" text-anchor="middle" dominant-baseline="central">100k + 100k divider</text>
<line x1="170" y1="410" x2="230" y2="410" class="wire"/>
<rect class="box" x="510" y="234" width="130" height="32" rx="6"/><text class="t" x="575" y="250" text-anchor="middle" dominant-baseline="central">Play / pause</text>
<rect class="box" x="510" y="274" width="130" height="32" rx="6"/><text class="t" x="575" y="290" text-anchor="middle" dominant-baseline="central">Previous</text>
<rect class="box" x="510" y="314" width="130" height="32" rx="6"/><text class="t" x="575" y="330" text-anchor="middle" dominant-baseline="central">Next</text>
<rect class="box" x="510" y="354" width="130" height="32" rx="6"/><text class="t" x="575" y="370" text-anchor="middle" dominant-baseline="central">Volume down</text>
<rect class="box" x="510" y="394" width="130" height="32" rx="6"/><text class="t" x="575" y="410" text-anchor="middle" dominant-baseline="central">Volume up</text>
<line x1="450" y1="250" x2="510" y2="250" class="wire"/>
<line x1="450" y1="290" x2="510" y2="290" class="wire"/>
<line x1="450" y1="330" x2="510" y2="330" class="wire"/>
<line x1="450" y1="370" x2="510" y2="370" class="wire"/>
<line x1="450" y1="410" x2="510" y2="410" class="wire"/>
<text class="ts" x="575" y="446" text-anchor="middle" dominant-baseline="central">Other leg of each to GND</text>
<text class="ts" x="340" y="496" text-anchor="middle" dominant-baseline="central">All grounds join: battery −, TP4056 OUT−, boost OUT−, ESP32, OLED, buttons, divider</text>
</svg>
