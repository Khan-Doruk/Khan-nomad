<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img">
<title>Main Nomad wiring on ESP32-S3 DevKitC-1</title>
<desc>USB power feeds the ESP32-S3 DevKitC-1. A microSD SDIO breakout connects 3V to 3V3, GND to GND, CLK to GPIO14, CMD to GPIO15, DAT0 to GPIO16, DAT1 to GPIO18, DAT2 to GPIO17 and DAT3 to GPIO21. An optional 1.47 inch ST7789 screen connects VCC to 3V3, GND to GND, DIN to GPIO45, CLK to GPIO40, CS to GPIO42, DC to GPIO41, RST to GPIO39 and BL to GPIO48.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#888780;stroke-width:0.8}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}
.teal .th{fill:#085041}
.teal .ts{fill:#085041}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}
.purple .th{fill:#3C3489}
.purple .ts{fill:#3C3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="480" rx="12" fill="#FFFFFF"/>
<rect class="box" x="260" y="36" width="160" height="40" rx="8"/>
<text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">USB power</text>
<line x1="340" y1="76" x2="340" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="120" width="160" height="300" rx="8"/>
<text class="th" x="120" y="140" text-anchor="middle" dominant-baseline="central">microSD breakout</text>
<text class="ts" x="120" y="160" text-anchor="middle" dominant-baseline="central">SDIO, 3.3V only</text>
<text class="ts" x="188" y="190" text-anchor="end" dominant-baseline="central">3V</text>
<text class="ts" x="188" y="220" text-anchor="end" dominant-baseline="central">GND</text>
<text class="ts" x="188" y="250" text-anchor="end" dominant-baseline="central">CLK</text>
<text class="ts" x="188" y="280" text-anchor="end" dominant-baseline="central">CMD</text>
<text class="ts" x="188" y="310" text-anchor="end" dominant-baseline="central">DAT0</text>
<text class="ts" x="188" y="340" text-anchor="end" dominant-baseline="central">DAT1</text>
<text class="ts" x="188" y="370" text-anchor="end" dominant-baseline="central">DAT2</text>
<text class="ts" x="188" y="400" text-anchor="end" dominant-baseline="central">DAT3</text></g>
<g class="purple"><rect x="260" y="100" width="160" height="320" rx="8"/>
<text class="th" x="340" y="122" text-anchor="middle" dominant-baseline="central">ESP32-S3 DevKitC-1</text>
<text class="ts" x="340" y="142" text-anchor="middle" dominant-baseline="central">WROOM-1 N16R8</text>
<text class="ts" x="272" y="190" dominant-baseline="central">3V3</text>
<text class="ts" x="272" y="220" dominant-baseline="central">GND</text>
<text class="ts" x="272" y="250" dominant-baseline="central">GPIO14</text>
<text class="ts" x="272" y="280" dominant-baseline="central">GPIO15</text>
<text class="ts" x="272" y="310" dominant-baseline="central">GPIO16</text>
<text class="ts" x="272" y="340" dominant-baseline="central">GPIO18</text>
<text class="ts" x="272" y="370" dominant-baseline="central">GPIO17</text>
<text class="ts" x="272" y="400" dominant-baseline="central">GPIO21</text>
<text class="ts" x="408" y="190" text-anchor="end" dominant-baseline="central">3V3</text>
<text class="ts" x="408" y="220" text-anchor="end" dominant-baseline="central">GND</text>
<text class="ts" x="408" y="250" text-anchor="end" dominant-baseline="central">GPIO45</text>
<text class="ts" x="408" y="280" text-anchor="end" dominant-baseline="central">GPIO40</text>
<text class="ts" x="408" y="310" text-anchor="end" dominant-baseline="central">GPIO42</text>
<text class="ts" x="408" y="340" text-anchor="end" dominant-baseline="central">GPIO41</text>
<text class="ts" x="408" y="370" text-anchor="end" dominant-baseline="central">GPIO39</text>
<text class="ts" x="408" y="400" text-anchor="end" dominant-baseline="central">GPIO48</text></g>
<rect class="box" x="480" y="120" width="160" height="300" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="560" y="140" text-anchor="middle" dominant-baseline="central">1.47" screen</text>
<text class="ts" x="560" y="160" text-anchor="middle" dominant-baseline="central">ST7789, optional</text>
<text class="ts" x="492" y="190" dominant-baseline="central">VCC</text>
<text class="ts" x="492" y="220" dominant-baseline="central">GND</text>
<text class="ts" x="492" y="250" dominant-baseline="central">DIN / SDA</text>
<text class="ts" x="492" y="280" dominant-baseline="central">CLK / SCL</text>
<text class="ts" x="492" y="310" dominant-baseline="central">CS</text>
<text class="ts" x="492" y="340" dominant-baseline="central">DC</text>
<text class="ts" x="492" y="370" dominant-baseline="central">RST</text>
<text class="ts" x="492" y="400" dominant-baseline="central">BL</text>
<line x1="200" y1="190" x2="260" y2="190" stroke="#E24B4A" stroke-width="1.5"/>
<line x1="200" y1="220" x2="260" y2="220" stroke="#2C2C2A" stroke-width="1.5"/>
<line x1="200" y1="250" x2="260" y2="250" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="200" y1="280" x2="260" y2="280" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="200" y1="310" x2="260" y2="310" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="200" y1="340" x2="260" y2="340" stroke="#BA7517" stroke-width="2"/>
<line x1="200" y1="370" x2="260" y2="370" stroke="#BA7517" stroke-width="2"/>
<line x1="200" y1="400" x2="260" y2="400" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="420" y1="190" x2="480" y2="190" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="220" x2="480" y2="220" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="250" x2="480" y2="250" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="280" x2="480" y2="280" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="310" x2="480" y2="310" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="340" x2="480" y2="340" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="370" x2="480" y2="370" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="400" x2="480" y2="400" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">Red = 3.3V power · amber = DAT1/DAT2, swapped on purpose (18 then 17) · dashed = optional</text>
</svg>
